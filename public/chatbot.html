<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGO Assistant - Wits Student Societies</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0B1F3A;
            font-family: 'Inter', sans-serif;
            color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .chatbot-container {
            width: 100%;
            max-width: 620px;
        }

        .chatbot-card {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid #e3e7ef;
            box-shadow: 0 12px 40px rgba(16, 35, 70, 0.28);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 640px;
        }

        /* ===== Header ===== */

        .chat-header {
            background: #0b1f3a;
            color: white;
            padding: 20px 26px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: white;
            color: #0b1f3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 3px;
            color: white;
        }

        .brand-text p {
            font-size: 13px;
            color: #d8e1ee;
        }

        /* ===== Chat area ===== */

        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 22px 20px;
            background-color: #efeae2;
            background-image: radial-gradient(rgba(255, 255, 255, 0.32) 1px, transparent 1px);
            background-size: 32px 32px;
            scroll-behavior: smooth;
        }

        /* Message rows */

        .message {
            display: flex;
            margin-bottom: 12px;
            position: relative;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        /* Bubbles */

        .message-bubble {
            max-width: 78%;
            padding: 9px 12px 10px;
            font-size: 13.5px;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        /* Bot bubble — white, tail top-left */
        .message.bot .message-bubble {
            background: #ffffff;
            color: #172033;
            border-radius: 0 12px 12px 12px;
        }

        .message.bot .message-bubble::before {
            content: '';
            position: absolute;
            top: 0;
            left: -7px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 8px 8px 0;
            border-color: transparent #ffffff transparent transparent;
        }

        /* "SGO Assistant" label above bot bubble text */
        .message.bot .message-bubble::after {
            content: "SGO Assistant";
            display: block;
            font-size: 10.5px;
            font-weight: 700;
            color: #2E6FBA;
            margin-bottom: 3px;
            letter-spacing: 0.02em;
        }

        /* User bubble — system blue, white text, tail top-right */
        .message.user .message-bubble {
            background: #2E6FBA;
            color: #ffffff;
            border-radius: 12px 0 12px 12px;
        }

        .message.user .message-bubble::before {
            content: '';
            position: absolute;
            top: 0;
            right: -7px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 8px 0 0;
            border-color: #2E6FBA transparent transparent transparent;
        }

        /* ===== Options — right-aligned ===== */

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 78%;
            margin-left: auto;
            margin-right: 0;
            margin-bottom: 14px;
            align-items: stretch;
        }

        .option-button {
            width: 100%;
            text-align: left;
            background: #ffffff;
            color: #172033;
            border: 1px solid #d8ded9;
            border-radius: 8px;
            padding: 10px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            line-height: 1.4;
            cursor: pointer;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.07);
            transition: all 0.15s ease;
        }

        .option-button:hover {
            border-color: #2E6FBA;
            background: #eef4ff;
        }

        .option-button:focus {
            outline: 2px solid #5479a8;
            outline-offset: 2px;
        }

        .option-button.secondary {
            color: #526176;
            background: #f8fafc;
        }

        .option-button.secondary:hover {
            background: #eef4ff;
            border-color: #2E6FBA;
        }

        /* ===== Typing indicator ===== */

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 11px 14px;
            background: #ffffff;
            border-radius: 0 12px 12px 12px;
            width: fit-content;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .typing::before {
            content: '';
            position: absolute;
            top: 0;
            left: -7px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 8px 8px 0;
            border-color: transparent #ffffff transparent transparent;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #8390a3;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-2px);
            }
        }

        /* ===== Footer ===== */

        .chat-footer {
            padding: 14px 24px;
            border-top: 1px solid #e5e9f0;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .footer-text {
            font-size: 11px;
            color: #7b8799;
        }

        .close-button {
            border: none;
            background: transparent;
            color: #59677c;
            font-size: 12px;
            cursor: pointer;
            padding: 6px 8px;
        }

        .close-button:hover {
            color: #0b1f3a;
        }

        /* ===== Scrollbar ===== */

        .chat-window::-webkit-scrollbar {
            width: 6px;
        }

        .chat-window::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-window::-webkit-scrollbar-thumb {
            background: #cbd3df;
            border-radius: 10px;
        }

        /* ===== Mobile ===== */

        @media (max-width: 600px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .chatbot-container {
                max-width: none;
            }

            .chatbot-card {
                min-height: 100vh;
                height: 100vh;
                border-radius: 0;
                border: none;
            }

            .chat-header {
                padding: 16px 20px;
            }

            .chat-window {
                padding: 18px 14px;
            }

            .chat-footer {
                padding: 12px 18px;
            }

            .message-bubble {
                max-width: 85%;
            }

            .options-container {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

<div class="chatbot-container">

    <div class="chatbot-card">

        <!-- Header -->
        <header class="chat-header">
            <div class="brand">

                <div class="brand-logo">
                    SGO
                </div>

                <div class="brand-text">
                    <h1>SGO Assistant</h1>
                    <p>Wits Student Societies</p>
                </div>

            </div>
        </header>

        <!-- Chat -->
        <main
            id="chatWindow"
            class="chat-window"
            aria-live="polite"
            aria-label="SGO Assistant conversation">
        </main>

        <!-- Footer -->
        <footer class="chat-footer">

            <span class="footer-text">
                Select an option to continue
            </span>

            <button
                id="closeChat"
                class="close-button"
                type="button">
                Close
            </button>

        </footer>

    </div>

</div>


<!-- Firebase - KEPT -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="/js/chatbot.js"></script>
<script src="/js/shared-nav.js"></script>

</body>
</html>
