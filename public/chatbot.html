<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGO Assistant - Wits Student Societies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Times New Roman', serif;
            background: #f8f9fa;
            padding: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 24px;
        }
        .header h1 {
            color: #003B5C;
            font-size: 32px;
            font-weight: bold;
        }
        .chat-container {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: white;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            word-wrap: break-word;
        }
        .message.user {
            background: #003B5C;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            background: #f1f3f5;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.typing {
            background: #f1f3f5;
            color: #6c757d;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-input {
            border-top: 1px solid #dee2e6;
            padding: 12px;
            display: flex;
            gap: 8px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        .chat-input input:focus {
            outline: none;
            border-color: #003B5C;
            box-shadow: 0 0 0 3px rgba(0, 59, 92, 0.1);
        }
        .chat-input button {
            padding: 10px 20px;
            background: #003B5C;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input button:hover {
            background: #002a44;
        }
        .nav-links {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #003B5C;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #003B5C;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-links a:hover {
            background: #003B5C;
            color: white;
        }
        .nav-links a.active {
            background: #003B5C;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>SGO Assistant</h1>
        </div>

        <!-- Chat Container -->
        <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will be rendered here -->
            </div>
            <div class="chat-input">
                <input 
                    id="chat-input" 
                    type="text" 
                    placeholder="Ask a question..." 
                    onkeydown="if(event.key === 'Enter') sendMessage()"
                />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- Navigation Links -->
        <div class="nav-links">
            <a href="/leader/dashboard.html">Dashboard</a>
            <a href="/leader/announcements.html">Announcements</a>
            <a href="/leader/my-requests.html">My Requests</a>
            <a href="/leader/new-request.html">New Request</a>
            <a href="/leader/documents.html">Documents</a>
            <a href="/chatbot.html" class="active">SGO Assistant</a>
            <a href="/login.html">Logout</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Custom JS -->
    <script src="/js/chatbot.js"></script>
</body>
</html>
