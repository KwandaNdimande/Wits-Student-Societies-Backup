<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGO Assistant - Wits Student Societies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 36px 32px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px rgba(46, 111, 186, 0.3);
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--navy-900);
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-500);
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-container {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #FAFBFD;
            display: flex;
            flex-direction: column;
            height: 420px;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            background: var(--navy-900);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            background: var(--bg);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.typing {
            background: var(--bg);
            color: #8FA6CC;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            font-style: italic;
        }
        .chat-input {
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            background: var(--surface);
        }
        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
        }
        .chat-input input:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .chat-input input::placeholder {
            color: var(--text-500);
        }
        .chat-input button {
            padding: 10px 24px;
            background: var(--navy-900);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .chat-input button:hover {
            background: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }.wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        @media (max-width: 480px) {
            .card {
                padding: 20px 16px;
            }
            .chat-container {
                height: 340px;
            }
            .nav-links a {
                font-size: 11px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Chat Card -->
        <div class="card">
            <div class="logo">SGO</div>
            <h1>SGO Assistant</h1>
            <p class="subtitle">Ask me anything about submissions, documents, or status</p>

            <div class="chat-container">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input id="chat-input" type="text" placeholder="Ask a question..." />
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/chatbot.js"></script>
<script src="/js/shared-nav.js"></script>
</body>
</html>
