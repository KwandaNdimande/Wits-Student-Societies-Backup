<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGO Assistant - Wits Student Societies</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            font-family: 'Inter', sans-serif;
            color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .chatbot-container {
            width: 100%;
            max-width: 620px;
        }

        .chatbot-card {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid #e3e7ef;
            box-shadow: 0 12px 40px rgba(16, 35, 70, 0.08);
            overflow: hidden;
        }

        /* Header */

        .chat-header {
            background: #0b1f3a;
            color: white;
            padding: 24px 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: white;
            color: #0b1f3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
        }

        .brand-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .brand-text p {
            font-size: 13px;
            color: #d8e1ee;
        }

        /* Chat */

        .chat-window {
            height: 500px;
            overflow-y: auto;
            padding: 24px;
            background: #f8fafc;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 82%;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.55;
        }

        .message.bot .message-bubble {
            background: white;
            border: 1px solid #e1e6ee;
            color: #273449;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: #0b1f3a;
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Options */

        .options-container {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .option-button {
            width: 100%;
            text-align: left;
            background: white;
            color: #172033;
            border: 1px solid #d9e0ea;
            border-radius: 9px;
            padding: 12px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            line-height: 1.4;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .option-button:hover {
            border-color: #0b1f3a;
            background: #f2f5f9;
        }

        .option-button:focus {
            outline: 2px solid #5479a8;
            outline-offset: 2px;
        }

        .option-button.secondary {
            color: #526176;
            background: #f8fafc;
        }

        /* Typing */

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 15px;
            background: white;
            border: 1px solid #e1e6ee;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #8390a3;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-2px);
            }
        }

        /* Footer */

        .chat-footer {
            padding: 14px 24px;
            border-top: 1px solid #e5e9f0;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-text {
            font-size: 11px;
            color: #7b8799;
        }

        .close-button {
            border: none;
            background: transparent;
            color: #59677c;
            font-size: 12px;
            cursor: pointer;
            padding: 6px 8px;
        }

        .close-button:hover {
            color: #0b1f3a;
        }

        /* Scrollbar */

        .chat-window::-webkit-scrollbar {
            width: 6px;
        }

        .chat-window::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-window::-webkit-scrollbar-thumb {
            background: #cbd3df;
            border-radius: 10px;
        }

        /* Mobile */

        @media (max-width: 600px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .chatbot-container {
                max-width: none;
            }

            .chatbot-card {
                min-height: 100vh;
                border-radius: 0;
                border: none;
            }

            .chat-window {
                height: calc(100vh - 145px);
            }

            .chat-header {
                padding: 20px;
            }

            .chat-window {
                padding: 18px;
            }

            .chat-footer {
                padding: 12px 18px;
            }

            .message-bubble {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="chatbot-container">

    <div class="chatbot-card">

        <!-- Header -->
        <header class="chat-header">
            <div class="brand">

                <div class="brand-logo">
                    SGO
                </div>

                <div class="brand-text">
                    <h1>SGO Assistant</h1>
                    <p>Wits Student Societies</p>
                </div>

            </div>
        </header>

        <!-- Chat -->
        <main
            id="chatWindow"
            class="chat-window"
            aria-live="polite"
            aria-label="SGO Assistant conversation">
        </main>

        <!-- Footer -->
        <footer class="chat-footer">

            <span class="footer-text">
                Select an option to continue
            </span>

            <button
                id="closeChat"
                class="close-button"
                type="button">
                Close
            </button>

        </footer>

    </div>

</div>


<!-- Firebase - KEPT -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="/js/chatbot.js"></script>
<script src="/js/shared-nav.js"></script>

</body>
</html>
