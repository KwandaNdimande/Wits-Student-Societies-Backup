<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGO Assistant - Wits Student Societies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wits-blue: #003366;
            --wits-gold: #FFCC00;
            --wits-dark: #002a54;
            --wits-darker: #001f3f;
            --wits-text: #f7f9ff;
            --wits-muted: #a8bbd8;
            --wits-border: rgba(255, 255, 255, 0.12);
            --wits-surface: rgba(0, 51, 102, 0.85);
            --radius: 12px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--wits-blue);
            color: var(--wits-text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
            background:
                radial-gradient(circle at 78% 35%, rgba(0, 51, 102, 0.6), transparent 32%),
                radial-gradient(circle at 18% 70%, rgba(0, 51, 102, 0.9), transparent 30%),
                linear-gradient(135deg, #003366 0%, #002a54 55%, #001f3f 100%);
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
        }
        .card {
            background: rgba(0, 51, 102, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            padding: 36px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--wits-blue);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            margin: 0 auto 16px;
            flex-shrink: 0;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--wits-text);
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--wits-muted);
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-container {
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            background: rgba(0, 42, 84, 0.5);
            display: flex;
            flex-direction: column;
            height: 420px;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            background: var(--wits-gold);
            color: var(--wits-blue);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        .message.bot {
            background: rgba(255, 255, 255, 0.1);
            color: var(--wits-text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--wits-border);
        }
        .message.typing {
            background: rgba(255, 255, 255, 0.06);
            color: var(--wits-muted);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            font-style: italic;
            border: 1px solid var(--wits-border);
        }
        .chat-input {
            border-top: 1px solid var(--wits-border);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            background: rgba(0, 42, 84, 0.5);
        }
        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--wits-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--wits-text);
            background: rgba(255, 255, 255, 0.06);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .chat-input input:focus {
            outline: none;
            border-color: var(--wits-gold);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.15);
        }
        .chat-input input::placeholder {
            color: var(--wits-muted);
        }
        .chat-input button {
            padding: 10px 24px;
            background: var(--wits-gold);
            color: var(--wits-blue);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .chat-input button:hover {
            background: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: var(--wits-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--wits-muted);
            border-radius: 4px;
        }
        @media (max-width: 480px) {
            .card {
                padding: 20px 16px;
            }
            .chat-container {
                height: 340px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">SGO</div>
            <h1>SGO Assistant</h1>
            <p class="subtitle">Ask me anything about submissions, documents, or status</p>

            <div class="chat-container">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input id="chat-input" type="text" placeholder="Ask a question..." />
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/chatbot.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
