<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Wits Student Societies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Times New Roman', serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }
        .loading {
            font-size: 48px;
            margin-bottom: 16px;
            color: #003B5C;
        }
        h1 {
            color: #003B5C;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        p {
            color: #6c757d;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 4px solid #e9ecef;
            border-top: 4px solid #003B5C;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background: #003B5C;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Times New Roman', serif;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #002a44;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading">🏛️</div>
        <h1>Redirecting...</h1>
        <p>Please wait while we take you to your dashboard.</p>
        <div class="spinner"></div>
        <br />
        <a href="/login.html" class="btn">Return to Sign In</a>
    </div>

    <script>
        // Check for user role and redirect
        // For now, redirect to leader dashboard (since we don't have auth yet)
        // Later this will check the user's role from Firebase
        
        // TEMPORARY: Redirect to leader dashboard
        // In production, this would check the user's role from the session
        
        // Check if user is logged in (you can add your own logic)
        // For now, just go to leader dashboard
        setTimeout(() => {
            // Check for role (you can store this in localStorage or session)
            const userRole = localStorage.getItem('userRole') || 'leader';
            
            if (userRole === 'leader') {
                window.location.href = '/leader/dashboard.html';
            } else if (userRole === 'officer') {
                window.location.href = '/officer/dashboard.html';
            } else {
                // If no role, go to leader dashboard by default
                window.location.href = '/leader/dashboard.html';
            }
        }, 1500);
    </script>
</body>
</html>
