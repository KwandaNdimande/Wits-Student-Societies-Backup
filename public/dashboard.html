<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Wits Student Societies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wits-blue: #003366;
            --wits-gold: #FFCC00;
            --wits-dark: #002a54;
            --wits-darker: #001f3f;
            --wits-text: #f7f9ff;
            --wits-muted: #a8bbd8;
            --wits-border: rgba(255, 255, 255, 0.12);
            --wits-surface: rgba(0, 51, 102, 0.85);
            --radius: 12px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--wits-blue);
            color: var(--wits-text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 78% 35%, rgba(0, 51, 102, 0.6), transparent 32%),
                radial-gradient(circle at 18% 70%, rgba(0, 51, 102, 0.9), transparent 30%),
                linear-gradient(135deg, #003366 0%, #002a54 55%, #001f3f 100%);
        }
        .container {
            max-width: 520px;
            width: 100%;
        }
        .card {
            background: rgba(0, 51, 102, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            padding: 48px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--wits-blue);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #fff;
            margin: 0 auto 20px;
            flex-shrink: 0;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 600;
            color: var(--wits-text);
            text-align: center;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 15px;
            color: var(--wits-muted);
            text-align: center;
            margin-bottom: 28px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 12px auto 20px;
            border: 4px solid var(--wits-border);
            border-top: 4px solid var(--wits-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 34px;
            border-radius: 8px;
            border: 1px solid var(--wits-border);
            background: transparent;
            color: var(--wits-text);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: var(--wits-gold);
            border-color: var(--wits-gold);
            color: var(--wits-blue);
            font-weight: 700;
        }
        .btn-primary:hover {
            background: #e6b800;
            border-color: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .wits-badge {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: var(--wits-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">SGO</div>
            <h1>Redirecting...</h1>
            <p class="subtitle">Please wait while we take you to your dashboard.</p>
            <div class="spinner"></div>
            <br />
            <a href="/login.html" class="btn btn-primary">Return to Sign In</a>
            <div class="wits-badge">University of the Witwatersrand</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsWp91SrNnlVHoyJWJyxjvXgGY6debDLE",
            authDomain: "wits-student-societies-backup.firebaseapp.com",
            projectId: "wits-student-societies-backup",
            storageBucket: "wits-student-societies-backup.firebasestorage.app",
            messagingSenderId: "111338778369",
            appId: "1:111338778369:web:5633595cd3fec3113c3500",
            measurementId: "G-D01M5HWGOV"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const userUid = localStorage.getItem('userUid');
        const userRole = localStorage.getItem('userRole');

        if (!userUid) {
            window.location.href = '/login.html';
        }

        setTimeout(() => {
            if (userRole === 'officer') {
                window.location.href = '/officer/dashboard.html';
            } else {
                window.location.href = '/leader/dashboard.html';
            }
        }, 1500);
    </script>
</body>
</html>
