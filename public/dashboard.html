<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Wits Student Societies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #F3F6FB;
            --surface: #FFFFFF;
            --text-900: #16213E;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-900);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 520px;
            width: 100%;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 48px 40px;
            box-shadow: 0 8px 32px rgba(11, 31, 58, 0.06);
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #fff;
            margin: 0 auto 20px;
            box-shadow: 0 4px 12px rgba(19, 49, 92, 0.2);
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 600;
            color: var(--navy-900);
            text-align: center;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 15px;
            color: var(--text-500);
            text-align: center;
            margin-bottom: 28px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 12px auto 20px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--navy-900);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.01em;
        }
        .btn-primary {
            background: var(--navy-900);
            border-color: var(--navy-900);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--navy-800);
            border-color: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .wits-badge {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-500);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">SGO</div>
            <h1>Redirecting...</h1>
            <p class="subtitle">Please wait while we take you to your dashboard.</p>
            <div class="spinner"></div>
            <br />
            <a href="/login.html" class="btn btn-primary">Return to Sign In</a>
            <div class="wits-badge">University of the Witwatersrand</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsWp91SrNnlVHoyJWJyxjvXgGY6debDLE",
            authDomain: "wits-student-societies-backup.firebaseapp.com",
            projectId: "wits-student-societies-backup",
            storageBucket: "wits-student-societies-backup.firebasestorage.app",
            messagingSenderId: "111338778369",
            appId: "1:111338778369:web:5633595cd3fec3113c3500",
            measurementId: "G-D01M5HWGOV"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check authentication
        const userUid = localStorage.getItem('userUid');
        const userRole = localStorage.getItem('userRole');

        if (!userUid) {
            window.location.href = '/login.html';
        }

        // Redirect based on role
        setTimeout(() => {
            if (userRole === 'officer') {
                window.location.href = '/officer/dashboard.html';
            } else {
                window.location.href = '/leader/dashboard.html';
            }
        }, 1500);
    </script>
</body>
</html>
