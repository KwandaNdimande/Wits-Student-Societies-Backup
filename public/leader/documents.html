<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents - Leader Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --wits-blue: #003366;
            --wits-gold: #FFCC00;
            --wits-dark: #002a54;
            --wits-darker: #001f3f;
            --wits-text: #f7f9ff;
            --wits-muted: #a8bbd8;
            --wits-border: rgba(255, 255, 255, 0.12);
            --wits-surface: rgba(0, 51, 102, 0.85);
            --radius: 12px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--wits-blue);
            color: var(--wits-text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 90px 24px 40px 24px;
            background:
                radial-gradient(circle at 78% 35%, rgba(0, 51, 102, 0.6), transparent 32%),
                radial-gradient(circle at 18% 70%, rgba(0, 51, 102, 0.9), transparent 30%),
                linear-gradient(135deg, #003366 0%, #002a54 55%, #001f3f 100%);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--wits-text);
        }
        .header p {
            font-size: 15px;
            color: var(--wits-muted);
            margin-top: 4px;
        }

        .table-container {
            background: rgba(0, 51, 102, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: rgba(255, 255, 255, 0.06);
            border-bottom: 1px solid var(--wits-border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--wits-muted);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--wits-border);
            color: var(--wits-muted);
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        td .doc-name {
            font-weight: 600;
            color: var(--wits-text);
        }
        .doc-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-action {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-view {
            background: var(--wits-gold);
            color: var(--wits-blue);
        }
        .btn-view:hover {
            background: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 204, 0, 0.3);
        }
        .btn-download {
            background: rgba(255, 255, 255, 0.15);
            color: var(--wits-text);
            border: 1px solid var(--wits-border);
        }
        .btn-download:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .btn-info {
            background: rgba(255, 255, 255, 0.08);
            color: var(--wits-muted);
            border: 1px solid var(--wits-border);
        }
        .btn-info:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .no-docs {
            color: var(--wits-muted);
            font-size: 14px;
            text-align: center;
            padding: 40px 0;
        }

        .load-more-container {
            text-align: center;
            margin-top: 20px;
        }
        .btn-load-more {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 32px;
            border: 2px solid var(--wits-border);
            border-radius: 8px;
            background: transparent;
            color: var(--wits-text);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-load-more:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--wits-gold);
        }
        .btn-load-more:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-load-more.hidden {
            display: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: rgba(0, 51, 102, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            max-width: 500px;
            width: 90%;
            padding: 28px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--wits-border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--wits-text);
        }
        .modal-back {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: var(--wits-muted);
            padding: 4px 8px;
            font-family: 'Inter', sans-serif;
        }
        .modal-back:hover {
            color: var(--wits-text);
        }
        .modal-body .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid var(--wits-border);
        }
        .modal-body .detail-row .label {
            font-weight: 600;
            color: var(--wits-muted);
            width: 120px;
            flex-shrink: 0;
        }
        .modal-body .detail-row .value {
            color: var(--wits-text);
            flex: 1;
        }
        .modal-body .detail-row:last-child {
            border-bottom: none;
        }
        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--wits-border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--wits-muted);
            border: 1px solid var(--wits-border);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: var(--wits-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            body {
                padding: 80px 16px 20px 16px;
            }
            .table-container {
                overflow-x: auto;
            }
            th, td {
                padding: 10px 12px;
                font-size: 13px;
            }
            .doc-actions .btn-action {
                font-size: 11px;
                padding: 4px 10px;
            }
            .modal {
                padding: 20px;
            }
            .modal-body .detail-row {
                flex-direction: column;
                gap: 4px;
            }
            .modal-body .detail-row .label {
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Document Repository</h1>
            <p>Society Leader Dashboard</p>
        </div>

        <div id="documents-container">
            <div class="no-docs">Loading documents...</div>
        </div>

        <div id="load-more-container" class="load-more-container">
            <button id="load-more-btn" class="btn-load-more hidden">Load More</button>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Info Modal -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="infoModalTitle">Document Details</h2>
                <button class="modal-back" onclick="closeInfoModal()">← Back</button>
            </div>
            <div class="modal-body" id="infoModalBody">
                <div class="detail-row"><span class="label">Name</span><span class="value" id="info-name">-</span></div>
                <div class="detail-row"><span class="label">Description</span><span class="value" id="info-description">-</span></div>
                <div class="detail-row"><span class="label">Uploaded</span><span class="value" id="info-date">-</span></div>
                <div class="detail-row"><span class="label">Uploaded By</span><span class="value" id="info-by">-</span></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeInfoModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/leader-documents.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
