<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Documents - Leader Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Times New Roman',serif;background:#f8f9fa;padding:40px}.container{max-width:1200px;margin:0 auto}.header{margin-bottom:24px}.header h1{color:#003B5C;font-size:32px;font-weight:bold}.header p{color:#6c757d;margin-top:4px;font-size:16px}.doc-card{border:1px solid #dee2e6;border-radius:8px;padding:16px 20px;background:white;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.doc-info{flex:1}.doc-name{font-weight:500;color:#003B5C;font-size:16px}.doc-description{font-size:14px;color:#6c757d;margin-top:2px}.doc-download{padding:6px 16px;border:1px solid #003B5C;border-radius:6px;background:transparent;color:#003B5C;font-size:14px;cursor:pointer;transition:all 0.2s;font-family:'Times New Roman',serif}.doc-download:hover{background:#003B5C;color:white}.nav-links{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}.nav-links a{color:#003B5C;text-decoration:none;padding:8px 16px;border:1px solid #003B5C;border-radius:6px;font-size:14px;transition:all 0.2s}.nav-links a:hover{background:#003B5C;color:white}.nav-links a.active{background:#003B5C;color:white}</style></head>
<body><div class="container"><div class="header"><h1>Document Repository</h1><p>Society Leader Dashboard</p></div><div id="documents-container"></div><div class="nav-links"><a href="/leader/dashboard.html">Dashboard</a><a href="/leader/announcements.html">Announcements</a><a href="/leader/my-requests.html">My Requests</a><a href="/leader/new-request.html">New Request</a><a href="/leader/documents.html" class="active">Documents</a><a href="/chatbot.html">SGO Assistant</a><a href="/login.html">Logout</a></div></div><script>const documents=[{name:"Budget Form",description:"Required for all budget requests."},{name:"Indemnity Form",description:"Required for events involving external venues."},{name:"Vendor List",description:"Approved vendors for procurement."},{name:"Constitution Template",description:"Template for society constitutions."},{name:"SGO Guidelines",description:"Rules and procedures from the Student Governance Office."}];const container=document.getElementById('documents-container');container.innerHTML=documents.map(doc=>`<div class="doc-card"><div class="doc-info"><p class="doc-name">${doc.name}</p><p class="doc-description">${doc.description}</p></div><button class="doc-download" onclick="alert('Download: ${doc.name}')">Download</button></div>`).join('');</script></body></html>
