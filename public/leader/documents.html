<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents - Leader Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 90px 24px 40px 24px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }

        /* Table Styles */
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: #FAFBFD;
            border-bottom: 1px solid var(--border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-500);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-600);
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: #FAFBFD;
        }
        td .doc-name {
            font-weight: 600;
            color: var(--text-900);
        }
        .doc-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-action {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-view {
            background: #2E6FBA;
            color: #fff;
        }
        .btn-view:hover {
            background: #1B4F8A;
        }
        .btn-download {
            background: #003B5C;
            color: #fff;
        }
        .btn-download:hover {
            background: #1B3E73;
        }
        .btn-info {
            background: #6C757D;
            color: #fff;
        }
        .btn-info:hover {
            background: #5A6268;
        }
        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .no-docs {
            color: #8FA6CC;
            font-size: 14px;
            text-align: center;
            padding: 40px 0;
        }

        .load-more-container {
            text-align: center;
            margin-top: 20px;
        }
        .btn-load-more {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 32px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-load-more:hover {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
        }
        .btn-load-more:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-load-more.hidden {
            display: none;
        }

        /* Info Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 500px;
                    .modal {
                        max-width: 90%;
                        max-height: 90vh;
                        overflow-y: auto;
                    }
            width: 90%;
            padding: 28px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .modal-back {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-500);
            padding: 4px 8px;
            font-family: 'Inter', sans-serif;
        }
        .modal-back:hover {
            color: var(--text-900);
        }
        .modal-body .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .modal-body .detail-row .label {
            font-weight: 600;
            color: var(--text-600);
            width: 120px;
            flex-shrink: 0;
        }
        .modal-body .detail-row .value {
            color: var(--text-900);
            flex: 1;
        }
        .modal-body .detail-row:last-child {
            border-bottom: none;
        }
        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text-600);
        }
        .btn-secondary:hover {
            background: #d0d7e0;
        }

        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        @media (max-width: 768px) {
                        .modal {
                            max-width: 90%;
                            max-height: 85vh;
                        }
                        .table-container {
                            overflow-x: auto;
                        }
                        table {
                            min-width: 600px;
                        }
                        .modal {
                            max-width: 95%;
                            padding: 16px;
                        }
                        .modal-header h2 {
                            font-size: 16px;
                        }
                        th, td { 
                            padding: 8px 10px; 
                            font-size: 12px; 
                        }
            body {
                padding: 80px 16px 20px 16px;
            }
            .table-container {
                overflow-x: auto;
            }
            th, td {
                padding: 10px 12px;
                font-size: 13px;
            }
            .doc-actions .btn-action {
                font-size: 11px;
                padding: 4px 10px;
            }
            .modal {
                padding: 20px;
            }
            .modal-body .detail-row {
                flex-direction: column;
                gap: 4px;
            }
            .modal-body .detail-row .label {
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Document Repository</h1>
            <p>Society Leader Dashboard</p>
        </div>

        <!-- Documents Table -->
        <div id="documents-container">
            <div class="no-docs">Loading documents...</div>
        </div>

        <!-- Load More Button -->
        <div id="load-more-container" class="load-more-container">
            <button id="load-more-btn" class="btn-load-more hidden">Load More</button>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- ============ INFO MODAL ============ -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="infoModalTitle">Document Details</h2>
                <button class="modal-back" onclick="closeInfoModal()">← Back</button>
            </div>
            <div class="modal-body" id="infoModalBody">
                <div class="detail-row"><span class="label">Name</span><span class="value" id="info-name">-</span></div>
                <div class="detail-row"><span class="label">Description</span><span class="value" id="info-description">-</span></div>
                <div class="detail-row"><span class="label">Uploaded</span><span class="value" id="info-date">-</span></div>
                <div class="detail-row"><span class="label">Uploaded By</span><span class="value" id="info-by">-</span></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeInfoModal()">Close</button>
            </div>
        </div>
    </div>
    <!-- ============ END INFO MODAL ============ -->

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/leader-documents.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
