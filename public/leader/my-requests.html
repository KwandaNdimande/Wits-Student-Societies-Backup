<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Requests - Leader Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Times New Roman',serif;background:#f8f9fa;padding:40px}
        .container{max-width:1200px;margin:0 auto}
        .header{margin-bottom:24px}
        .header h1{color:#003B5C;font-size:32px;font-weight:bold}
        .header p{color:#6c757d;margin-top:4px;font-size:16px}
        .table-container{border:1px solid #dee2e6;border-radius:8px;overflow:hidden;background:white}
        table{width:100%;border-collapse:collapse;font-size:14px}
        thead{background:#f1f3f5;border-bottom:1px solid #dee2e6}
        th{padding:12px 16px;text-align:left;font-weight:500;color:#6c757d}
        td{padding:12px 16px;border-bottom:1px solid #f1f3f5}
        tr:hover{background:#f8f9fa}
        .status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500}
        .status-submitted{background:#cfe2ff;color:#004085}
        .status-under-review{background:#fff3cd;color:#856404}
        .status-approved{background:#d4edda;color:#155724}
        .status-rejected{background:#f8d7da;color:#721c24}
        .status-revision{background:#ffe5d0;color:#853d00}
        .empty-state{text-align:center;padding:60px 0;border:1px solid #dee2e6;border-radius:8px;background:white}
        .empty-state p{color:#6c757d}
        .empty-state a{display:inline-block;margin-top:16px;padding:10px 20px;background:#003B5C;color:white;text-decoration:none;border-radius:6px;font-size:14px}
        .empty-state a:hover{background:#002a44}
        .nav-links{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
        .nav-links a{color:#003B5C;text-decoration:none;padding:8px 16px;border:1px solid #003B5C;border-radius:6px;font-size:14px;transition:all 0.2s}
        .nav-links a:hover{background:#003B5C;color:white}
        .nav-links a.active{background:#003B5C;color:white}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Requests</h1>
            <p>Track the status of your budget requests</p>
        </div>
        <div id="requests-container"></div>
        <div class="nav-links">
            <a href="/leader/dashboard.html">Dashboard</a>
            <a href="/leader/announcements.html">Announcements</a>
            <a href="/leader/my-requests.html" class="active">My Requests</a>
            <a href="/leader/new-request.html">New Request</a>
            <a href="/leader/documents.html">Documents</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/login.html">Logout</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Custom JS -->
    <script src="/js/leader-my-requests.js"></script>
</body>
</html>
