<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Requests - Leader Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --success: #1E8E5A;
            --success-bg: #E5F5EC;
            --warning: #B9720B;
            --warning-bg: #FCF1DE;
            --danger: #C0392B;
            --danger-bg: #FBEAE8;
            --info: #2E6FBA;
            --info-bg: #E7F0FB;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: #FAFBFD;
            border-bottom: 1px solid var(--border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-500);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-600);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: #FAFBFD;
        }
        td.strong {
            color: var(--text-900);
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background: var(--info-bg);
            color: var(--info);
        }
        .status-under-review {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .status-approved {
            background: var(--success-bg);
            color: var(--success);
        }
        .status-rejected {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .status-revision {
            background: #FFF3E0;
            color: #E65100;
        }
        .btn-update {
            font-size: 12px;
            color: #fff;
            background: var(--warning);
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-update:hover {
            background: #8d5a0a;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-500);
        }
        .empty-state p {
            font-size: 15px;
            margin-bottom: 16px;
        }
        .empty-state a {
            display: inline-block;
            padding: 10px 28px;
            background: #fff;
            color: var(--navy-900);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .empty-state a:hover {
            background: #e0e0e0;
        }
        .nav-links {
            margin-top: 28px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #8FA6CC;
            text-decoration: none;
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }
        .nav-links a.active {
            background: #fff;
            color: var(--navy-900);
            border-color: #fff;
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 550px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-500);
        }
        .modal-close:hover {
            color: var(--text-900);
        }
        .modal-body {
            padding: 4px 0;
        }
        .modal-body .doc-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .modal-body .doc-item:last-child {
            border-bottom: none;
        }
        .modal-body .doc-name {
            font-weight: 600;
            color: var(--text-900);
        }
        .modal-body .doc-detail {
            font-size: 13px;
            color: var(--text-500);
            margin-top: 2px;
        }
        .modal-body .file-input {
            margin-top: 6px;
            display: block;
        }
        .modal-body .file-input input[type="file"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
        }
        .modal-body .comment-area {
            margin-top: 16px;
        }
        .modal-body .comment-area textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 60px;
        }
        .modal-body .comment-area textarea:focus {
            outline: none;
            border-color: var(--navy-900);
        }
        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--navy-900);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--navy-800);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text-600);
        }
        .btn-secondary:hover {
            background: #d0d7e0;
        }
        .officer-comment {
            background: #FFF3E0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #E65100;
            margin-top: 4px;
            display: inline-block;
        }
        @media (max-width: 768px) {
            .table-container {
                overflow-x: auto;
            }
            body { padding: 20px 16px; }
            th, td { padding: 10px 12px; font-size: 13px; }
            .modal { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Requests</h1>
            <p>Track the status of your budget requests</p>
        </div>

        <div id="requests-container"></div>

        <div class="nav-links">
            <a href="/leader/dashboard.html">Dashboard</a>
            <a href="/leader/announcements.html">Announcements</a>
            <a href="/leader/my-requests.html" class="active">My Requests</a>
            <a href="/leader/new-request.html">New Request</a>
            <a href="/leader/documents.html">Documents</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/login.html">Logout</a>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Update Documents Modal -->
    <div class="modal-overlay" id="updateModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Update Documents</h2>
                <button class="modal-close" onclick="closeUpdateModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="no-docs">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/leader-my-requests.js"></script>
</body>
</html>
