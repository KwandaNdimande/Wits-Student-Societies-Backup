<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Requests - Leader Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase SDK (required for uploads and downloads) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --success: #1E8E5A;
            --success-bg: #E5F5EC;
            --warning: #B9720B;
            --warning-bg: #FCF1DE;
            --danger: #C0392B;
            --danger-bg: #FBEAE8;
            --info: #2E6FBA;
            --info-bg: #E7F0FB;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .controls .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .controls .search-box input {
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #fff;
            background: rgba(255,255,255,0.06);
            min-width: 250px;
            transition: border-color 0.2s;
        }
        .controls .search-box input::placeholder {
            color: #8FA6CC;
        }
        .controls .search-box input:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
        }
        .controls .results-count {
            font-size: 13px;
            color: #8FA6CC;
        }
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .hidden {
            display: none !important;
        }
        .clickable-row { cursor: pointer; }
        .detail-view {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: center;
            margin-bottom: 18px;
        }
        .detail-label {
            font-size: 13px;
            color: var(--text-500);
            min-width: 110px;
        }
        .detail-value {
            font-size: 14px;
            color: var(--text-900);
            flex: 1;
        }
        .detail-docs {
            margin-top: 18px;
        }
        .detail-docs .doc-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 12px;
            background: #FAFBFD;
        }
        .detail-docs .doc-item strong {
            font-weight: 600;
            color: var(--text-900);
            min-width: 140px;
            font-size: 14px;
        }
        .detail-docs .doc-item div {
            color: var(--text-500);
            font-size: 13px;
            flex: 1;
            word-break: break-word;
        }
        .detail-back {
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: #FAFBFD;
            border-bottom: 1px solid var(--border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-500);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-600);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: #FAFBFD;
        }
        td.strong {
            color: var(--text-900);
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background: var(--info-bg);
            color: var(--info);
        }
        .status-under-review {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .status-approved {
            background: var(--success-bg);
            color: var(--success);
        }
        .status-rejected {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .status-revision {
            background: #FFF3E0;
            color: #E65100;
        }
        .status-resubmitted {
            background: #E3F2FD;
            color: #0D47A1;
        }
        .btn-update {
            font-size: 12px;
            color: #fff;
            background: var(--warning);
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-update:hover {
            background: #8d5a0a;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-500);
        }
        .empty-state p {
            font-size: 15px;
            margin-bottom: 16px;
        }
        .empty-state a {
            display: inline-block;
            padding: 10px 28px;
            background: #fff;
            color: var(--navy-900);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .empty-state a:hover {
            background: #e0e0e0;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-top: 1px solid var(--border);
            background: #FAFBFD;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination .info {
            font-size: 13px;
            color: var(--text-500);
        }
        .pagination .pages {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .pagination .pages button {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text-600);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .pagination .pages button:hover:not(:disabled) {
            border-color: var(--navy-900);
            color: var(--navy-900);
        }
        .pagination .pages button.active {
            background: var(--navy-900);
            color: #fff;
            border-color: var(--navy-900);
        }
        .pagination .pages button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .pages .ellipsis {
            color: var(--text-500);
            padding: 0 4px;
        }
        .nav-bell {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .nav-bell-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #8FA6CC;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .nav-bell-btn:hover {
            background: rgba(255,255,255,0.12);
        }
        .notification-badge {
            min-width: 18px;
            height: 18px;
            padding: 0 6px;
            border-radius: 999px;
            background: #E53935;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .notification-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 320px;
            max-width: calc(100vw - 40px);
            background: var(--surface);
            color: var(--text-900);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 18px 48px rgba(0,0,0,0.16);
            z-index: 1000;
            display: none;
        }
        .notification-dropdown.active {
            display: block;
        }
        .notification-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .notification-item:last-child {
            border-bottom: none;
        }
        .notification-item:hover {
            background: #F4F7FB;
        }
        .notification-item .title {
            font-weight: 700;
            color: var(--text-900);
            margin-bottom: 5px;
        }
        .notification-item .meta {
            font-size: 12px;
            color: var(--text-500);
        }
        .notification-item .note {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-600);
        }
        .notification-item.empty {
            cursor: default;
            color: var(--text-500);
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* ================================================================
           MODAL STYLES (with backdrop blur)
           ================================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 550px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-500);
        }
        .modal-close:hover {
            color: var(--text-900);
        }
        .modal-body {
            padding: 4px 0;
            color: var(--text-900);
        }
        .modal-body .doc-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .modal-body .doc-item:last-child {
            border-bottom: none;
        }
        .modal-body .doc-name {
            font-weight: 600;
            color: var(--text-900);
        }
        .modal-body .doc-detail {
            font-size: 13px;
            color: var(--text-500);
            margin-top: 2px;
        }
        .modal-body .file-input {
            margin-top: 6px;
            display: block;
        }
        .modal-body .file-input input[type="file"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
        }
        .modal-body .comment-area {
            margin-top: 16px;
        }
        .modal-body .comment-area textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 60px;
        }
        .modal-body .comment-area textarea:focus {
            outline: none;
            border-color: var(--navy-900);
        }
        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--navy-900);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--navy-800);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text-600);
        }
        .btn-secondary:hover {
            background: #d0d7e0;
        }
        .officer-comment {
            background: #FFF3E0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #E65100;
            margin-top: 4px;
            display: inline-block;
        }

        /* ================================================================
           DOWNLOAD BUTTON
           ================================================================ */
        .btn-download {
            padding: 5px 16px;
            background: #003B5C;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s ease;
            margin-left: auto;
            white-space: nowrap;
        }
        .btn-download:hover {
            background: #1B3E73;
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls .search-box input {
                min-width: auto;
                width: 100%;
            }
            .table-container {
                overflow-x: auto;
            }
            body { padding: 20px 16px; }
            th, td { padding: 10px 12px; font-size: 13px; }
            .modal { padding: 20px; }
            .pagination {
                flex-direction: column;
                text-align: center;
            }
            .detail-docs .doc-item {
                flex-wrap: wrap;
                gap: 8px;
            }
            .detail-docs .doc-item strong {
                min-width: 100%;
            }
            .btn-download {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Requests</h1>
            <p>Track the status of your budget requests</p>
        </div>

        <div class="controls" id="controls">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="🔍 Search requests..." oninput="searchRequests()" />
            </div>
            <div class="results-count" id="resultsCount">Showing 0 of 0 requests</div>
        </div>

        <div id="request-detail-view" class="detail-view hidden">
            <div class="detail-back">
                <button type="button" class="btn btn-secondary" onclick="closeDetailView()">Back</button>
            </div>
            <div class="detail-row" style="margin-bottom:18px; align-items:flex-start; gap:12px;">
                <div style="flex:1;">
                    <h2 id="detail-title" style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;color:var(--navy-900);margin-bottom:8px;">Request Details</h2>
                    <div class="detail-status-row" style="display:flex;align-items:center;gap:10px;">
                        <span class="detail-label" style="min-width:auto;">Status</span>
                        <span id="detail-status" class="status-badge status-submitted"></span>
                    </div>
                </div>
            </div>
            <div id="detailBody"></div>
        </div>

        <div id="requests-container"></div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Update Documents Modal -->
    <div class="modal-overlay" id="updateModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Update Documents</h2>
                <button class="modal-back" onclick="closeUpdateModal()" style="background:none;border:none;cursor:pointer;font-size:14px;margin-right:12px;">← Back to Requests</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="no-docs">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Supabase is already loaded in the <head> -->
    <!-- Your page scripts -->
    <script src="/js/leader-my-requests.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
