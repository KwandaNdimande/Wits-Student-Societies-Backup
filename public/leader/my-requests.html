<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Requests - Leader Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --wits-blue: #003366;
            --wits-gold: #FFCC00;
            --wits-dark: #002a54;
            --wits-darker: #001f3f;
            --wits-text: #f7f9ff;
            --wits-muted: #a8bbd8;
            --wits-border: rgba(255, 255, 255, 0.12);
            --wits-surface: rgba(0, 51, 102, 0.85);
            --radius: 12px;
            --success: #4CAF50;
            --success-bg: rgba(76, 175, 80, 0.15);
            --warning: #FFC107;
            --warning-bg: rgba(255, 193, 7, 0.15);
            --danger: #ef5350;
            --danger-bg: rgba(239, 83, 80, 0.15);
            --info: #4a9eff;
            --info-bg: rgba(74, 158, 255, 0.15);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--wits-blue);
            color: var(--wits-text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 90px 24px 40px 24px;
            background:
                radial-gradient(circle at 78% 35%, rgba(0, 51, 102, 0.6), transparent 32%),
                radial-gradient(circle at 18% 70%, rgba(0, 51, 102, 0.9), transparent 30%),
                linear-gradient(135deg, #003366 0%, #002a54 55%, #001f3f 100%);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--wits-text);
        }
        .header p {
            font-size: 15px;
            color: var(--wits-muted);
            margin-top: 4px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .controls .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .controls .search-box input {
            padding: 10px 14px;
            border: 1px solid var(--wits-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--wits-text);
            background: rgba(255, 255, 255, 0.06);
            min-width: 250px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .controls .search-box input::placeholder {
            color: var(--wits-muted);
        }
        .controls .search-box input:focus {
            outline: none;
            border-color: var(--wits-gold);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.15);
        }
        .controls .results-count {
            font-size: 13px;
            color: var(--wits-muted);
        }
        .table-container {
            background: rgba(0, 51, 102, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .hidden {
            display: none !important;
        }
        .detail-view {
            background: rgba(0, 51, 102, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        .detail-row {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: center;
            margin-bottom: 18px;
        }
        .detail-label {
            font-size: 13px;
            color: var(--wits-muted);
            min-width: 110px;
        }
        .detail-value {
            font-size: 14px;
            color: var(--wits-text);
            flex: 1;
        }
        .detail-docs {
            margin-top: 18px;
        }
        .detail-docs .doc-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--wits-border);
            border-radius: 12px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.04);
        }
        .detail-docs .doc-item strong {
            font-weight: 600;
            color: var(--wits-text);
            min-width: 140px;
            font-size: 14px;
        }
        .detail-docs .doc-item div {
            color: var(--wits-muted);
            font-size: 13px;
            flex: 1;
            word-break: break-word;
        }
        .detail-back {
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: rgba(255, 255, 255, 0.06);
            border-bottom: 1px solid var(--wits-border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--wits-muted);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--wits-border);
            color: var(--wits-muted);
        }
        tr:last-child td {
            border-bottom: none;
        }
        td.strong {
            color: var(--wits-text);
            font-weight: 600;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background: var(--info-bg);
            color: var(--info);
        }
        .status-under-review {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .status-approved {
            background: var(--success-bg);
            color: var(--success);
        }
        .status-rejected {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .status-revision {
            background: rgba(255, 152, 0, 0.15);
            color: #FF9800;
        }
        .status-resubmitted {
            background: rgba(74, 158, 255, 0.15);
            color: #4a9eff;
        }
        .btn-update {
            font-size: 12px;
            color: var(--wits-blue);
            background: var(--wits-gold);
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-update:hover {
            background: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 204, 0, 0.3);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--wits-muted);
        }
        .empty-state p {
            font-size: 15px;
            margin-bottom: 16px;
        }
        .empty-state a {
            display: inline-block;
            padding: 10px 28px;
            background: var(--wits-gold);
            color: var(--wits-blue);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .empty-state a:hover {
            background: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-top: 1px solid var(--wits-border);
            background: rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination .info {
            font-size: 13px;
            color: var(--wits-muted);
        }
        .pagination .pages {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .pagination .pages button {
            padding: 6px 12px;
            border: 1px solid var(--wits-border);
            border-radius: 6px;
            background: transparent;
            color: var(--wits-muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .pagination .pages button:hover:not(:disabled) {
            border-color: var(--wits-gold);
            color: var(--wits-text);
        }
        .pagination .pages button.active {
            background: var(--wits-gold);
            color: var(--wits-blue);
            border-color: var(--wits-gold);
        }
        .pagination .pages button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .pages .ellipsis {
            color: var(--wits-muted);
            padding: 0 4px;
        }
        .nav-bell {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .nav-bell-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--wits-muted);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--wits-border);
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .nav-bell-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .notification-badge {
            min-width: 18px;
            height: 18px;
            padding: 0 6px;
            border-radius: 999px;
            background: var(--danger);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .notification-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 320px;
            max-width: calc(100vw - 40px);
            background: rgba(0, 51, 102, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--wits-text);
            border: 1px solid var(--wits-border);
            border-radius: 14px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: none;
        }
        .notification-dropdown.active {
            display: block;
        }
        .notification-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--wits-border);
            cursor: pointer;
        }
        .notification-item:last-child {
            border-bottom: none;
        }
        .notification-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .notification-item .title {
            font-weight: 700;
            color: var(--wits-text);
            margin-bottom: 5px;
        }
        .notification-item .meta {
            font-size: 12px;
            color: var(--wits-muted);
        }
        .notification-item .note {
            margin-top: 8px;
            font-size: 13px;
            color: var(--wits-muted);
        }
        .notification-item.empty {
            cursor: default;
            color: var(--wits-muted);
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: var(--wits-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: rgba(0, 51, 102, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            max-width: 550px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--wits-border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--wits-text);
        }
        .modal-back {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: var(--wits-muted);
            padding: 4px 8px;
            font-family: 'Inter', sans-serif;
        }
        .modal-back:hover {
            color: var(--wits-text);
        }
        .modal-body {
            padding: 4px 0;
            color: var(--wits-text);
        }
        .modal-body .doc-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--wits-border);
        }
        .modal-body .doc-item:last-child {
            border-bottom: none;
        }
        .modal-body .doc-name {
            font-weight: 600;
            color: var(--wits-text);
        }
        .modal-body .doc-detail {
            font-size: 13px;
            color: var(--wits-muted);
            margin-top: 2px;
        }
        .modal-body .file-input {
            margin-top: 6px;
            display: block;
        }
        .modal-body .file-input input[type="file"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--wits-border);
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.06);
            color: var(--wits-text);
        }
        .modal-body .comment-area {
            margin-top: 16px;
        }
        .modal-body .comment-area textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--wits-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.06);
            color: var(--wits-text);
            resize: vertical;
            min-height: 60px;
        }
        .modal-body .comment-area textarea:focus {
            outline: none;
            border-color: var(--wits-gold);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.15);
        }
        .modal-body .comment-area textarea::placeholder {
            color: var(--wits-muted);
        }
        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--wits-border);
            display: flex;
            gap: 12px;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--wits-gold);
            color: var(--wits-blue);
        }
        .btn-primary:hover {
            background: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--wits-muted);
            border: 1px solid var(--wits-border);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .officer-comment {
            background: rgba(255, 152, 0, 0.15);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #FF9800;
            margin-top: 4px;
            display: inline-block;
        }

        /* Action Buttons */
        .btn-action {
            display: inline-block;
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
        }
        .btn-details {
            background: var(--wits-gold);
            color: var(--wits-blue);
        }
        .btn-details:hover {
            background: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 204, 0, 0.3);
        }
        .btn-docs {
            background: rgba(74, 158, 255, 0.3);
            color: #4a9eff;
            border: 1px solid rgba(74, 158, 255, 0.3);
        }
        .btn-docs:hover {
            background: rgba(74, 158, 255, 0.4);
        }
        .btn-no-docs {
            background: rgba(255, 255, 255, 0.06);
            color: var(--wits-muted);
            cursor: not-allowed;
            border: 1px solid var(--wits-border);
        }
        .btn-update-action {
            background: #FF9800;
            color: var(--wits-blue);
        }
        .btn-update-action:hover {
            background: #e68900;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.3);
        }
        .btn-view-doc {
            padding: 5px 16px;
            background: var(--wits-gold);
            color: var(--wits-blue);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-view-doc:hover {
            background: #e6b800;
        }
        .btn-download {
            padding: 5px 16px;
            background: rgba(255, 255, 255, 0.15);
            color: var(--wits-text);
            border: 1px solid var(--wits-border);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-download:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls .search-box input {
                min-width: auto;
                width: 100%;
            }
            .table-container {
                overflow-x: auto;
            }
            body {
                padding: 80px 16px 20px 16px;
            }
            th, td { padding: 10px 12px; font-size: 13px; }
            .modal { padding: 20px; }
            .pagination {
                flex-direction: column;
                text-align: center;
            }
            .detail-docs .doc-item {
                flex-wrap: wrap;
                gap: 8px;
            }
            .detail-docs .doc-item strong {
                min-width: 100%;
            }
            .btn-download,
            .btn-view-doc {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
            .detail-docs .doc-item > div {
                width: 100%;
                flex-wrap: wrap;
            }
            .btn-action {
                display: block;
                width: 100%;
                margin-bottom: 4px;
            }
            td .btn-action {
                margin-right: 0 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Requests</h1>
            <p>Track the status of your budget requests</p>
        </div>

        <div class="controls" id="controls">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="🔍 Search requests..." oninput="searchRequests()" />
            </div>
            <div class="results-count" id="resultsCount">Showing 0 of 0 requests</div>
        </div>

        <div id="request-detail-view" class="detail-view hidden">
            <div class="detail-back">
                <button type="button" class="btn btn-secondary" onclick="closeDetailView()">← Back</button>
            </div>
            <div class="detail-row" style="margin-bottom:18px; align-items:flex-start; gap:12px;">
                <div style="flex:1;">
                    <h2 id="detail-title" style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;color:var(--wits-text);margin-bottom:8px;">Request Details</h2>
                    <div class="detail-status-row" style="display:flex;align-items:center;gap:10px;">
                        <span class="detail-label" style="min-width:auto;">Status</span>
                        <span id="detail-status" class="status-badge status-submitted"></span>
                    </div>
                </div>
            </div>
            <div id="detailBody"></div>
        </div>

        <div id="requests-container"></div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Update Documents Modal -->
    <div class="modal-overlay" id="updateModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Update Documents</h2>
                <button class="modal-back" onclick="closeUpdateModal()" style="background:none;border:none;cursor:pointer;font-size:14px;margin-right:12px;color:var(--wits-muted);">← Back to Requests</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="no-docs">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/leader-my-requests.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
