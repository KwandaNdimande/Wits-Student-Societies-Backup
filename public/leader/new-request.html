<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>New Request - Leader Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Times New Roman',serif;background:#f8f9fa;padding:40px}.container{max-width:800px;margin:0 auto}.header{margin-bottom:24px}.header h1{color:#003B5C;font-size:32px;font-weight:bold}.header p{color:#6c757d;margin-top:4px;font-size:16px}.form-card{border:1px solid #dee2e6;border-radius:8px;padding:24px;background:white}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:14px;font-weight:500;color:#333;margin-bottom:4px}.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #ced4da;border-radius:6px;font-size:14px;font-family:Arial,sans-serif}.form-group input:disabled{background:#f1f3f5;color:#6c757d}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#003B5C;box-shadow:0 0 0 3px rgba(0,59,92,0.1)}.form-group textarea{resize:vertical;min-height:80px}.form-hint{font-size:12px;color:#6c757d;margin-top:2px}.file-group{margin-bottom:12px}.file-group label{display:block;font-size:12px;color:#6c757d;margin-bottom:2px}.file-group input[type=file]{width:100%;padding:8px 12px;border:1px solid #ced4da;border-radius:6px;font-size:14px;font-family:Arial,sans-serif}.form-actions{display:flex;gap:12px;margin-top:12px}.btn-submit{padding:10px 20px;background:#003B5C;color:white;border:none;border-radius:6px;font-size:14px;cursor:pointer;transition:background 0.2s;font-family:'Times New Roman',serif}.btn-submit:hover{background:#002a44}.btn-cancel{padding:10px 20px;background:transparent;color:#333;border:1px solid #ced4da;border-radius:6px;font-size:14px;cursor:pointer;transition:background 0.2s;font-family:'Times New Roman',serif}.btn-cancel:hover{background:#f1f3f5}.success-page{text-align:center;padding:60px 0}.success-icon{color:#28a745;font-size:48px;margin-bottom:16px}.success-page h1{color:#003B5C;font-size:28px;font-weight:bold}.success-page p{color:#6c757d;margin-top:8px}.btn-another{margin-top:16px;padding:10px 20px;background:#003B5C;color:white;border:none;border-radius:6px;font-size:14px;cursor:pointer;transition:background 0.2s;font-family:'Times New Roman',serif}.btn-another:hover{background:#002a44}.hidden{display:none}.nav-links{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}.nav-links a{color:#003B5C;text-decoration:none;padding:8px 16px;border:1px solid #003B5C;border-radius:6px;font-size:14px;transition:all 0.2s}.nav-links a:hover{background:#003B5C;color:white}.nav-links a.active{background:#003B5C;color:white}</style></head>
<body><div class="container"><div class="header"><h1>Submit Budget Request</h1><p>Fill in all fields and attach the required documents.</p></div><div id="form-section"><div class="form-card"><div class="form-group"><label>Society Name</label><input disabled value="Your Society" /><div class="form-hint">Pre-filled from your account.</div></div><div class="form-group"><label>Request Type</label><select id="request-type"><option value="">Select type...</option><option value="Event">Event</option><option value="Regalia">Regalia</option></select></div><div class="form-group"><label>Event / Item Name</label><input id="item-name" placeholder="e.g. Annual Gala Dinner" /></div><div class="form-group"><label>Amount Requested (R)</label><input id="amount" type="number" placeholder="0.00" /></div><div class="form-group"><label>Description</label><textarea id="description" placeholder="Describe the purpose of this request..." rows="3"></textarea></div><div class="form-group"><label style="font-weight:500;margin-bottom:8px;">Required Documents (PDF only)</label><div class="file-group"><label>Budget Form</label><input type="file" accept=".pdf" /></div><div class="file-group"><label>Meeting Minutes</label><input type="file" accept=".pdf" /></div><div class="file-group"><label>Vendor Quotation</label><input type="file" accept=".pdf" /></div></div><div class="form-actions"><button class="btn-submit" onclick="submitRequest()">Submit Request</button><button class="btn-cancel" onclick="alert('Cancelled')">Cancel</button></div></div></div><div id="success-section" class="success-page hidden"><div class="success-icon">✓</div><h1>Request Submitted</h1><p>Your request has been submitted successfully. You can track its status on the My Requests page.</p><button class="btn-another" onclick="resetForm()">Submit Another</button></div><div class="nav-links"><a href="/leader/dashboard.html">Dashboard</a><a href="/leader/announcements.html">Announcements</a><a href="/leader/my-requests.html">My Requests</a><a href="/leader/new-request.html" class="active">New Request</a><a href="/leader/documents.html">Documents</a><a href="/chatbot.html">SGO Assistant</a><a href="/login.html">Logout</a></div></div><script>function submitRequest(){const type=document.getElementById('request-type').value;const itemName=document.getElementById('item-name').value;const amount=document.getElementById('amount').value;const description=document.getElementById('description').value;if(!type||!itemName||!amount||!description){alert('Please fill in all fields before submitting.');return;}document.getElementById('form-section').classList.add('hidden');document.getElementById('success-section').classList.remove('hidden');}function resetForm(){document.getElementById('request-type').value='';document.getElementById('item-name').value='';document.getElementById('amount').value='';document.getElementById('description').value='';document.querySelectorAll('input[type="file"]').forEach(input=>input.value='');document.getElementById('form-section').classList.remove('hidden');document.getElementById('success-section').classList.add('hidden');}</script></body></html>
