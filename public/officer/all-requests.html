<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Requests - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --success: #1E8E5A;
            --success-bg: #E5F5EC;
            --warning: #B9720B;
            --warning-bg: #FCF1DE;
            --danger: #C0392B;
            --danger-bg: #FBEAE8;
            --info: #2E6FBA;
            --info-bg: #E7F0FB;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .controls .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .controls .search-box input {
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #fff;
            background: rgba(255,255,255,0.06);
            min-width: 250px;
            transition: border-color 0.2s;
        }
        .controls .search-box input::placeholder {
            color: #8FA6CC;
        }
        .controls .search-box input:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
        }
        .controls .results-count {
            font-size: 13px;
            color: #8FA6CC;
        }
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-x: auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 1200px;
        }
        thead {
            background: #FAFBFD;
            border-bottom: 1px solid var(--border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-500);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-600);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: #FAFBFD;
        }
        td.strong {
            color: var(--text-900);
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background: var(--info-bg);
            color: var(--info);
        }
        .status-under-review {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .status-approved {
            background: var(--success-bg);
            color: var(--success);
        }
        .status-rejected {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .status-revision {
            background: #FFF3E0;
            color: #E65100;
        }
        .status-resubmitted {
            background: #E3F2FD;
            color: #0D47A1;
        }
        .status-select {
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            cursor: pointer;
            color: var(--text-900);
        }
        .status-select:focus {
            outline: none;
            border-color: var(--navy-900);
        }
        .status-select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-view {
            font-size: 12px;
            color: var(--info);
            background: none;
            border: 1px solid var(--info);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-view:hover {
            background: var(--info);
            color: #fff;
        }
        .btn-flag {
            font-size: 12px;
            color: var(--warning);
            background: none;
            border: 1px solid var(--warning);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-flag:hover {
            background: var(--warning);
            color: #fff;
        }
        .btn-delete {
            font-size: 12px;
            color: var(--danger);
            background: none;
            border: 1px solid var(--danger);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-500);
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-top: 1px solid var(--border);
            background: #FAFBFD;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination .info {
            font-size: 13px;
            color: var(--text-500);
        }
        .pagination .pages {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .pagination .pages button {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text-600);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .pagination .pages button:hover:not(:disabled) {
            border-color: var(--navy-900);
            color: var(--navy-900);
        }
        .pagination .pages button.active {
            background: var(--navy-900);
            color: #fff;
            border-color: var(--navy-900);
        }
        .pagination .pages button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .pages .ellipsis {
            color: var(--text-500);
            padding: 0 4px;
        }
        .nav-links {
            margin-top: 28px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #8FA6CC;
            text-decoration: none;
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }
        .nav-links a.active {
            background: #fff;
            color: var(--navy-900);
            border-color: #fff;
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-500);
        }
        .modal-close:hover {
            color: var(--text-900);
        }
        .modal-body {
            padding: 8px 0;
        }
        .modal-body label {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-600);
            display: block;
            margin-bottom: 4px;
        }
        .modal-body textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 80px;
        }
        .modal-body textarea:focus {
            outline: none;
            border-color: var(--navy-900);
        }
        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--navy-900);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--navy-800);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text-600);
        }
        .btn-secondary:hover {
            background: #d0d7e0;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #a93226;
        }
        .doc-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .doc-item:last-child {
            border-bottom: none;
        }
        .doc-name {
            font-weight: 600;
            color: var(--text-900);
        }
        .doc-detail {
            font-size: 13px;
            color: var(--text-500);
            margin-top: 2px;
        }
        .no-docs {
            color: var(--text-500);
            text-align: center;
            padding: 20px 0;
        }
        .waiting-text {
            color: #E65100;
            font-weight: 600;
            font-size: 12px;
        }
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls .search-box input {
                min-width: auto;
                width: 100%;
            }
            body { padding: 20px 16px; }
            th, td { padding: 10px 12px; font-size: 13px; }
            .modal { padding: 20px; }
            .pagination {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>All Requests</h1>
            <p>View and manage all budget requests</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="🔍 Search requests..." oninput="searchRequests()" />
            </div>
            <div class="results-count" id="resultsCount">Showing 0 of 0 requests</div>
        </div>

        <div id="requests-container"></div>

        <div class="nav-links">
            <a href="/officer/dashboard.html">Dashboard</a>
            <a href="/officer/announcements.html">Announcements</a>
            <a href="/officer/all-requests.html" class="active">All Requests</a>
            <a href="/officer/societies.html">Manage Societies</a>
            <a href="/officer/reports.html">Reports</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/officer/documents.html">Documents</a>
            <a href="/login.html" class="logout-link">Logout</a>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Document Modal -->
    <div class="modal-overlay" id="docModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Request Documents</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <div class="no-docs">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Flag Modal -->
    <div class="modal-overlay" id="flagModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="flagModalTitle">Flag for Revision</h2>
                <button class="modal-close" onclick="closeFlagModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label for="flagComment">Reason for Revision</label>
                <textarea id="flagComment" placeholder="Please provide details on what needs to be corrected..."></textarea>
                <div class="modal-footer">
                    <button class="btn btn-danger" onclick="submitFlag()">Flag Request</button>
                    <button class="btn btn-secondary" onclick="closeFlagModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-all-requests.js"></script>
<script>
(function() {
    const navLinks = document.querySelector('.nav-links');
    if (!navLinks) return;

    const userName = localStorage.getItem('userName') || 'Guest';
    const userRole = localStorage.getItem('userRole') || '';
    const roleLabel = userRole ? userRole.charAt(0).toUpperCase() + userRole.slice(1) : '';
    const userInfo = document.createElement('div');
    userInfo.className = 'nav-user-info';
    userInfo.textContent = userName + (roleLabel ? ' · ' + roleLabel : '');
    userInfo.style.cssText = 'color: #8FA6CC; font-size: 13px; font-weight: 600; width: 100%; margin-bottom: 8px;';
    if (!navLinks.querySelector('.nav-user-info')) {
        navLinks.prepend(userInfo);
    }

    const logoutLink = navLinks.querySelector('a.logout-link');
    if (!logoutLink) return;
    logoutLink.addEventListener('click', function(event) {
        event.preventDefault();
        if (confirm('Are you sure you want to log out?')) {
            localStorage.removeItem('userUid');
            localStorage.removeItem('userRole');
            localStorage.removeItem('userName');
            window.location.href = '/login.html';
        }
    });
})();
</script>
</body>
</html>
