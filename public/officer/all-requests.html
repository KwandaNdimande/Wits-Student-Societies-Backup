<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Requests - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #F3F6FB;
            --surface: #FFFFFF;
            --text-900: #16213E;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --success: #1E8E5A;
            --success-bg: #E5F5EC;
            --warning: #B9720B;
            --warning-bg: #FCF1DE;
            --danger: #C0392B;
            --danger-bg: #FBEAE8;
            --info: #2E6FBA;
            --info-bg: #E7F0FB;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-900);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .header p {
            font-size: 15px;
            color: var(--text-500);
            margin-top: 4px;
        }
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-x: auto;
            box-shadow: 0 4px 16px rgba(11, 31, 58, 0.04);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 1100px;
        }
        thead {
            background: #FAFBFD;
            border-bottom: 1px solid var(--border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-500);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-600);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: #FAFBFD;
        }
        td.strong {
            color: var(--text-900);
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-submitted {
            background: var(--info-bg);
            color: var(--info);
        }
        .status-under-review {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .status-approved {
            background: var(--success-bg);
            color: var(--success);
        }
        .status-rejected {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .status-revision {
            background: #FFF3E0;
            color: #E65100;
        }
        .status-resubmitted {
            background: #E3F2FD;
            color: #0D47A1;
        }
        .status-select {
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            cursor: pointer;
            color: var(--text-900);
        }
        .status-select:focus {
            outline: none;
            border-color: var(--navy-900);
        }
        .status-select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-view {
            font-size: 12px;
            color: var(--info);
            background: none;
            border: 1px solid var(--info);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-view:hover {
            background: var(--info);
            color: #fff;
        }
        .btn-delete {
            font-size: 12px;
            color: var(--danger);
            background: none;
            border: 1px solid var(--danger);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-500);
        }
        .nav-links {
            margin-top: 28px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--navy-900);
            text-decoration: none;
            padding: 8px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .nav-links a:hover {
            background: var(--navy-900);
            color: #fff;
            border-color: var(--navy-900);
        }
        .nav-links a.active {
            background: var(--navy-900);
            color: #fff;
            border-color: var(--navy-900);
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: var(--text-500);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-500);
        }
        .modal-close:hover {
            color: var(--text-900);
        }
        .doc-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .doc-item:last-child {
            border-bottom: none;
        }
        .doc-name {
            font-weight: 600;
            color: var(--text-900);
        }
        .doc-detail {
            font-size: 13px;
            color: var(--text-500);
            margin-top: 2px;
        }
        .doc-version {
            font-size: 12px;
            color: var(--text-500);
            margin-top: 2px;
        }
        .doc-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }
        .doc-status.current {
            background: var(--success-bg);
            color: var(--success);
        }
        .doc-status.old {
            background: #f1f1f5;
            color: #6B6B7A;
        }
        .doc-status.missing {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .no-docs {
            color: var(--text-500);
            text-align: center;
            padding: 20px 0;
        }
        @media (max-width: 768px) {
            body { padding: 20px 16px; }
            th, td { padding: 10px 12px; font-size: 13px; }
            .modal { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>All Requests</h1>
            <p>View and manage all budget requests</p>
        </div>

        <div id="requests-container"></div>

        <div class="nav-links">
            <a href="/officer/dashboard.html">Dashboard</a>
            <a href="/officer/announcements.html">Announcements</a>
            <a href="/officer/all-requests.html" class="active">All Requests</a>
            <a href="/officer/societies.html">Manage Societies</a>
            <a href="/officer/reports.html">Reports</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/officer/documents.html">Documents</a>
            <a href="/login.html">Logout</a>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Document Modal -->
    <div class="modal-overlay" id="docModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Request Documents</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <div class="no-docs">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-all-requests.js"></script>
</body>
</html>
