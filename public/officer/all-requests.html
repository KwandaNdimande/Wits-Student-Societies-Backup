<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>All Requests - Officer Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Times New Roman',serif;background:#f8f9fa;padding:40px}.container{max-width:1400px;margin:0 auto}.header{margin-bottom:24px}.header h1{color:#003B5C;font-size:32px;font-weight:bold}.header p{color:#6c757d;margin-top:4px;font-size:16px}.table-container{border:1px solid #dee2e6;border-radius:8px;overflow-x:auto;background:white}table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px}thead{background:#f1f3f5;border-bottom:1px solid #dee2e6}th{padding:12px 16px;text-align:left;font-weight:500;color:#6c757d}td{padding:12px 16px;border-bottom:1px solid #f1f3f5}tr:hover{background:#f8f9fa}.status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500}.status-submitted{background:#cfe2ff;color:#004085}.status-under-review{background:#fff3cd;color:#856404}.status-approved{background:#d4edda;color:#155724}.status-rejected{background:#f8d7da;color:#721c24}.status-revision{background:#ffe5d0;color:#853d00}.status-select{padding:4px 8px;border:1px solid #ced4da;border-radius:4px;font-size:12px;font-family:Arial,sans-serif;background:white;cursor:pointer}.status-select:focus{outline:none;border-color:#003B5C;box-shadow:0 0 0 3px rgba(0,59,92,0.1)}.nav-links{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}.nav-links a{color:#003B5C;text-decoration:none;padding:8px 16px;border:1px solid #003B5C;border-radius:6px;font-size:14px;transition:all 0.2s}.nav-links a:hover{background:#003B5C;color:white}.nav-links a.active{background:#003B5C;color:white}</style></head>
<body><div class="container"><div class="header"><h1>All Requests</h1><p>View and manage all budget requests</p></div><div id="requests-container"></div><div class="nav-links"><a href="/officer/dashboard.html">Dashboard</a><a href="/officer/announcements.html">Announcements</a><a href="/officer/all-requests.html" class="active">All Requests</a><a href="/officer/societies.html">Manage Societies</a><a href="/officer/reports.html">Reports</a><a href="/chatbot.html">SGO Assistant</a><a href="/officer/documents.html">Documents</a><a href="/login.html">Logout</a></div></div><script>let requests=[{id:1,society:"Wits Debating Union",name:"Annual Gala",type:"Event",amount:15000,date:"2026-06-01",status:"Submitted"},{id:2,society:"CS Club",name:"Society T-Shirts",type:"Regalia",amount:4500,date:"2026-05-20",status:"Under Review"},{id:3,society:"Law Society",name:"Moot Court Competition",type:"Event",amount:22000,date:"2026-05-15",status:"Approved"}];const statusColors={Submitted:"status-submitted","Under Review":"status-under-review",Approved:"status-approved",Rejected:"status-rejected","Revision Required":"status-revision"};const statusOptions=["Submitted","Under Review","Approved","Rejected","Revision Required"];function renderRequests(){const container=document.getElementById('requests-container');if(requests.length===0){container.innerHTML='<div class="table-container"><div style="text-align:center;padding:40px;color:#6c757d;">No requests found.</div></div>';return;}let html='<div class="table-container"><table><thead><tr><th>Society</th><th>Request</th><th>Type</th><th>Amount</th><th>Date</th><th>Status</th><th>Update Status</th></tr></thead><tbody>';requests.forEach(r=>{const statusClass=statusColors[r.status]||'status-submitted';const optionsHTML=statusOptions.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${s}</option>`).join('');html+=`<tr><td><strong>${r.society}</strong></td><td>${r.name}</td><td style="color:#6c757d;">${r.type}</td><td>R${r.amount.toLocaleString()}</td><td style="color:#6c757d;">${r.date}</td><td><span class="status-badge ${statusClass}">${r.status}</span></td><td><select class="status-select" onchange="updateStatus(${r.id}, this.value)">${optionsHTML}</select></td></tr>`;});html+='</tbody></table></div>';container.innerHTML=html;}function updateStatus(id,newStatus){requests=requests.map(r=>r.id===id?{...r,status:newStatus}:r);renderRequests();}renderRequests();</script></body></html>
