<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Announcements - Officer Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Times New Roman',serif;background:#f8f9fa;padding:40px}.container{max-width:1200px;margin:0 auto}.header{margin-bottom:24px}.header h1{color:#003B5C;font-size:32px;font-weight:bold}.header p{color:#6c757d;margin-top:4px;font-size:16px}.create-section{border:1px solid #dee2e6;border-radius:8px;padding:20px;background:white;margin-bottom:24px}.create-section h2{color:#003B5C;font-size:18px;margin-bottom:12px}.create-section input,.create-section textarea{width:100%;padding:8px 12px;border:1px solid #ced4da;border-radius:6px;font-size:14px;font-family:Arial,sans-serif;margin-bottom:10px}.create-section input:focus,.create-section textarea:focus{outline:none;border-color:#003B5C;box-shadow:0 0 0 3px rgba(0,59,92,0.1)}.create-section textarea{resize:vertical;min-height:80px}.btn-post{padding:10px 20px;background:#003B5C;color:white;border:none;border-radius:6px;font-size:14px;cursor:pointer;transition:background 0.2s;font-family:'Times New Roman',serif}.btn-post:hover{background:#002a44}.announcement-card{border:1px solid #dee2e6;border-radius:8px;padding:20px;background:white;margin-bottom:16px}.announcement-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:4px}.announcement-title{font-weight:600;color:#003B5C;font-size:18px}.announcement-meta{display:flex;align-items:center;gap:12px;flex-shrink:0}.announcement-date{font-size:12px;color:#6c757d}.announcement-body{font-size:14px;color:#6c757d;margin-top:4px}.btn-delete{font-size:12px;color:#dc3545;background:none;border:none;cursor:pointer;font-family:'Times New Roman',serif}.btn-delete:hover{color:#a71d2a}.nav-links{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}.nav-links a{color:#003B5C;text-decoration:none;padding:8px 16px;border:1px solid #003B5C;border-radius:6px;font-size:14px;transition:all 0.2s}.nav-links a:hover{background:#003B5C;color:white}.nav-links a.active{background:#003B5C;color:white}</style></head>
<body><div class="container"><div class="header"><h1>Announcements</h1><p>Manage announcements for all societies</p></div><div class="create-section"><h2>Create Announcement</h2><input id="announcement-title" placeholder="Title" /><textarea id="announcement-body" placeholder="Message..." rows="3"></textarea><button class="btn-post" onclick="postAnnouncement()">Post Announcement</button></div><div id="announcements-container"></div><div class="nav-links"><a href="/officer/dashboard.html">Dashboard</a><a href="/officer/announcements.html" class="active">Announcements</a><a href="/officer/all-requests.html">All Requests</a><a href="/officer/societies.html">Manage Societies</a><a href="/officer/reports.html">Reports</a><a href="/chatbot.html">SGO Assistant</a><a href="/officer/documents.html">Documents</a><a href="/login.html">Logout</a></div></div><script>let announcements=[{id:1,title:"Budget Submission Deadline",body:"All budget requests for Semester 2 must be submitted by 15 July 2026.",date:"2026-06-10"},{id:2,title:"SGO Office Hours Update",body:"The SGO office will be closed from 25 June to 2 July for the mid-year break.",date:"2026-06-05"}];function renderAnnouncements(){const container=document.getElementById('announcements-container');if(announcements.length===0){container.innerHTML='<p style="color:#6c757d;font-size:14px;">No announcements at this time.</p>';return;}container.innerHTML=announcements.map(a=>`<div class="announcement-card"><div class="announcement-header"><h2 class="announcement-title">${a.title}</h2><div class="announcement-meta"><span class="announcement-date">${a.date}</span><button class="btn-delete" onclick="deleteAnnouncement(${a.id})">Delete</button></div></div><p class="announcement-body">${a.body}</p></div>`).join('');}function postAnnouncement(){const title=document.getElementById('announcement-title').value.trim();const body=document.getElementById('announcement-body').value.trim();if(!title||!body){alert('Please fill in both title and message.');return;}announcements=[{id:Date.now(),title,body,date:new Date().toISOString().split('T')[0]},...announcements];renderAnnouncements();document.getElementById('announcement-title').value='';document.getElementById('announcement-body').value='';}function deleteAnnouncement(id){if(!confirm('Delete this announcement?'))return;announcements=announcements.filter(a=>a.id!==id);renderAnnouncements();}renderAnnouncements();</script></body></html>
