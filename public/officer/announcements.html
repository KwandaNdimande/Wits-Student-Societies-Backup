<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --danger: #C0392B;
            --success: #1E8E5A;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 90px 24px 40px 24px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }

        /* Create Section */
        .create-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 32px;
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .create-section .section-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
            margin-bottom: 18px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
        }
        .form-grid .full-width {
            grid-column: 1 / -1;
        }
        .form-grid label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-600);
            margin-bottom: 4px;
        }
        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-grid input:focus,
        .form-grid select:focus,
        .form-grid textarea:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .form-grid textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-grid .date-error {
            color: #D64545;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .form-grid .date-error.show {
            display: block;
        }
        .btn-post {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: var(--navy-900);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
            grid-column: 1 / -1;
            justify-self: start;
        }
        .btn-post:hover:not(:disabled) {
            background: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .btn-post:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Table */
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: #FAFBFD;
            border-bottom: 1px solid var(--border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-500);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-600);
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: #FAFBFD;
        }
        .category-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .btn-action {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-block;
            margin-right: 4px;
        }
        .btn-view {
            background: #2E6FBA;
            color: #fff;
        }
        .btn-view:hover {
            background: #1B4F8A;
        }
        .btn-delete {
            background: var(--danger);
            color: #fff;
        }
        .btn-delete:hover {
            background: #922B21;
        }
        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .no-announcements {
            color: #8FA6CC;
            font-size: 14px;
            text-align: center;
            padding: 40px 0;
        }

        /* Load More */
        .load-more-container {
            text-align: center;
            margin-top: 20px;
        }
        .btn-load-more {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 32px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-load-more:hover {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
        }
        .btn-load-more:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-load-more.hidden {
            display: none;
        }

        /* View Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 500px;
            width: 90%;
            padding: 28px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .modal-back {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-500);
            padding: 4px 8px;
            font-family: 'Inter', sans-serif;
        }
        .modal-back:hover {
            color: var(--text-900);
        }
        .modal-body .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .modal-body .detail-row .label {
            font-weight: 600;
            color: var(--text-600);
            width: 100px;
            flex-shrink: 0;
        }
        .modal-body .detail-row .value {
            color: var(--text-900);
            flex: 1;
        }
        .modal-body .detail-row:last-child {
            border-bottom: none;
        }
        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text-600);
        }
        .btn-secondary:hover {
            background: #d0d7e0;
        }

        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            body {
                padding: 80px 16px 20px 16px;
            }
            .create-section {
                padding: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
            .table-container {
                overflow-x: auto;
            }
            th, td {
                padding: 10px 12px;
                font-size: 13px;
            }
            .btn-action {
                font-size: 11px;
                padding: 4px 10px;
            }
            .modal {
                padding: 20px;
            }
        }
        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .btn-action {
                display: block;
                width: 100%;
                margin-bottom: 4px;
                text-align: center;
            }
            .modal-body .detail-row {
                flex-direction: column;
            }
            .modal-body .detail-row .label {
                width: auto;
            }
            .btn-load-more {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Announcements</h1>
            <p>Manage announcements for all societies</p>
        </div>

        <!-- Create Section (Officer only) -->
        <div class="create-section">
            <div class="section-header">
                <h2>Create Announcement</h2>
            </div>
            <div class="form-grid">
                <div>
                    <label for="announcement-title">Title</label>
                    <input id="announcement-title" placeholder="Enter title..." />
                </div>
                <div>
                    <label for="announcement-category">Category</label>
                    <select id="announcement-category">
                        <option value="">Select category...</option>
                        <option value="Upcoming Event">Upcoming Event</option>
                        <option value="Training Induction">Training Induction</option>
                        <option value="General Notice">General Notice</option>
                        <option value="Deadline Reminder">Deadline Reminder</option>
                    </select>
                </div>
                <div>
                    <label for="announcement-date">Date</label>
                    <input id="announcement-date" type="date" />
                    <div id="date-error" class="date-error">Please select a date from today onwards.</div>
                </div>
                <div class="full-width">
                    <label for="announcement-body">Message</label>
                    <textarea id="announcement-body" placeholder="Write your announcement message here..." rows="3"></textarea>
                </div>
                <button class="btn-post" id="postButton" onclick="postAnnouncement()">Post Announcement</button>
            </div>
        </div>

        <!-- Announcements Table -->
        <div id="announcements-container">
            <div class="no-announcements">Loading announcements...</div>
        </div>

        <!-- Load More -->
        <div id="load-more-container" class="load-more-container">
            <button id="load-more-btn" class="btn-load-more hidden">Load More</button>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- View Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="viewModalTitle">Announcement</h2>
                <button class="modal-back" onclick="closeViewModal()">← Back</button>
            </div>
            <div class="modal-body" id="viewModalBody">
                <div class="detail-row"><span class="label">Title</span><span class="value" id="view-title">-</span></div>
                <div class="detail-row"><span class="label">Category</span><span class="value" id="view-category">-</span></div>
                <div class="detail-row"><span class="label">Posted</span><span class="value" id="view-date">-</span></div>
                <div class="detail-row"><span class="label">Message</span><span class="value" id="view-message">-</span></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeViewModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-announcements.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
