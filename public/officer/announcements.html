<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --danger: #C0392B;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }
        .create-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .create-section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy-900);
            margin-bottom: 12px;
        }
        .create-section input,
        .create-section textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
            margin-bottom: 10px;
        }
        .create-section input:focus,
        .create-section textarea:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .create-section textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn-post {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: var(--navy-900);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-post:hover {
            background: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .btn-post:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .announcement-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        /* Modal basic styles */
        .modal-overlay { display: none; position: fixed; inset:0; background: rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center; }
        .modal-overlay.active, .modal-overlay[style*="display:flex"] { display:flex; }
        .modal { background: var(--surface); border-radius:var(--radius); max-width:700px; width:90%; padding:24px; box-shadow:0 8px 32px rgba(0,0,0,0.3); }
        .modal-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:12px; }
        .modal-footer { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
        .announcement-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 6px;
        }
        .announcement-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .announcement-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .announcement-date {
            font-size: 13px;
            color: var(--text-500);
        }
        .btn-delete {
            font-size: 12px;
            color: var(--danger);
            background: none;
            border: 1px solid var(--danger);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
        }
        .announcement-body {
            font-size: 14px;
            color: var(--text-600);
            line-height: 1.6;
        }
        .no-announcements {
            color: var(--text-500);
            font-size: 14px;
            text-align: center;
            padding: 30px 0;
        }.wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        @media (max-width: 480px) {
            body { padding: 20px 16px; }
            .create-section { padding: 18px 16px; }
            .announcement-card { padding: 16px; }
            .announcement-header { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Announcements</h1>
            <p>Manage announcements for all societies</p>
        </div>

        <div class="create-section">
            <h2>Create Announcement</h2>
            <input id="announcement-title" placeholder="Title" />
            <select id="announcement-category">
                <option value="">Category...</option>
                <option value="Upcoming Event">Upcoming Event</option>
                <option value="Training Induction">Training Induction</option>
                <option value="General Notice">General Notice</option>
                <option value="Deadline Reminder">Deadline Reminder</option>
            </select>
            <input id="announcement-date" type="date" />
            <textarea id="announcement-body" placeholder="Message..." rows="3"></textarea>
            <button class="btn-post" onclick="postAnnouncement()">Post Announcement</button>
        </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="announcementModal" style="display:none;">
        <div class="modal" style="max-width:680px;">
            <div class="modal-header">
                <h2 id="announcementModalTitle">Edit Announcement</h2>
                <button class="modal-back" onclick="closeAnnouncementModal()" style="background:none;border:none;cursor:pointer;font-size:14px;margin-right:12px;">← Back to Announcements</button>
            </div>
            <div class="modal-body" id="announcementModalBody">
                <input id="edit-ann-title" placeholder="Title" />
                <select id="edit-ann-category">
                    <option value="">Category...</option>
                    <option value="Upcoming Event">Upcoming Event</option>
                    <option value="Training Induction">Training Induction</option>
                    <option value="General Notice">General Notice</option>
                    <option value="Deadline Reminder">Deadline Reminder</option>
                </select>
                <input id="edit-ann-date" type="date" />
                <textarea id="edit-ann-body" placeholder="Message..." rows="4"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="saveAnnBtn" onclick="saveAnnouncementEdits()">Save</button>
                <button class="btn btn-secondary" onclick="closeAnnouncementModal()">Cancel</button>
            </div>
        </div>
    </div>

        <div id="announcements-container"></div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-announcements.js"></script>
<script src="/js/shared-nav.js"></script>
</body>
</html>
