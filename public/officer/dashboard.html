<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Officer Dashboard - Wits Student Societies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wits-blue: #003366;
            --wits-gold: #FFCC00;
            --wits-dark: #002a54;
            --wits-darker: #001f3f;
            --wits-text: #f7f9ff;
            --wits-muted: #a8bbd8;
            --wits-border: rgba(255, 255, 255, 0.12);
            --wits-surface: rgba(0, 51, 102, 0.85);
            --radius: 12px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--wits-blue);
            color: var(--wits-text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
            background:
                radial-gradient(circle at 78% 35%, rgba(0, 51, 102, 0.6), transparent 32%),
                radial-gradient(circle at 18% 70%, rgba(0, 51, 102, 0.9), transparent 30%),
                linear-gradient(135deg, #003366 0%, #002a54 55%, #001f3f 100%);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--wits-text);
        }
        .header p {
            font-size: 15px;
            color: var(--wits-muted);
            margin-top: 4px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: rgba(0, 51, 102, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            padding: 20px 24px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
        }
        .stat-card .stat-number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--wits-text);
        }
        .stat-card .stat-label {
            font-size: 13px;
            color: var(--wits-muted);
            margin-top: 4px;
            font-weight: 500;
        }
        .stat-card.blue .stat-number { color: #4a9eff; }
        .stat-card.yellow .stat-number { color: var(--wits-gold); }
        .stat-card.green .stat-number { color: #4CAF50; }
        .stat-card.red .stat-number { color: #ef5350; }
        .stat-card.orange .stat-number { color: #FF9800; }
        .recent-section {
            background: rgba(0, 51, 102, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .recent-section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--wits-text);
            margin-bottom: 12px;
        }
        .recent-section p {
            color: var(--wits-muted);
            font-size: 14px;
        }
        .recent-section h3 {
            font-size: 14px;
            color: var(--wits-muted);
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .recent-item {
            border-bottom: 1px solid var(--wits-border);
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .recent-item:last-child {
            border-bottom: none;
        }
        .recent-item .name {
            font-weight: 600;
            color: var(--wits-text);
        }
        .recent-item .society {
            font-size: 13px;
            color: var(--wits-muted);
        }
        .recent-item .status {
            color: var(--wits-muted);
        }
        .recent-highlight {
            border: 1px solid var(--wits-border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .recent-highlight .name {
            font-size: 16px;
            font-weight: 700;
            color: var(--wits-text);
        }
        .recent-highlight .society {
            color: var(--wits-muted);
            margin-top: 6px;
        }
        .recent-highlight .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            border: 1px solid var(--wits-border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--wits-text);
        }

        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: var(--wits-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            body { padding: 20px 16px; }
            .recent-section { padding: 18px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="welcomeHeading">Welcome back</h1>
            <p>Student Governance Office Dashboard</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card blue">
                <div class="stat-number">0</div>
                <div class="stat-label">Submitted</div>
            </div>
            <div class="stat-card yellow">
                <div class="stat-number">0</div>
                <div class="stat-label">Under Review</div>
            </div>
            <div class="stat-card green">
                <div class="stat-number">0</div>
                <div class="stat-label">Approved</div>
            </div>
            <div class="stat-card red">
                <div class="stat-number">0</div>
                <div class="stat-label">Rejected</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-number">0</div>
                <div class="stat-label">Revision Required</div>
            </div>
        </div>

        <div class="recent-section">
            <h2>Recent Requests</h2>
            <p>No requests submitted yet.</p>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-dashboard.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
