<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Officer Dashboard - Wits Student Societies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card.orange .stat-number { color: #E65100; }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .stat-card .stat-number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .stat-card .stat-label {
            font-size: 13px;
            color: var(--text-500);
            margin-top: 4px;
            font-weight: 500;
        }
        .stat-card.blue .stat-number { color: var(--blue-600); }
        .stat-card.yellow .stat-number { color: #B9720B; }
        .stat-card.green .stat-number { color: #1E8E5A; }
        .stat-card.red .stat-number { color: #C0392B; }
        .recent-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .recent-section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy-900);
            margin-bottom: 12px;
        }
        .recent-section p {
            color: var(--text-500);
            font-size: 14px;
        }
        .nav-links {
            margin-top: 28px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #8FA6CC;
            text-decoration: none;
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }
        .nav-links a.active {
            background: #fff;
            color: var(--navy-900);
            border-color: #fff;
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            body { padding: 20px 16px; }
            .recent-section { padding: 18px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="welcomeHeading">Welcome back</h1>
            <p>Student Governance Office Dashboard</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card blue">
                <div class="stat-number">0</div>
                <div class="stat-label">Submitted</div>
            </div>
            <div class="stat-card yellow">
                <div class="stat-number">0</div>
                <div class="stat-label">Under Review</div>
            </div>
            <div class="stat-card green">
                <div class="stat-number">0</div>
                <div class="stat-label">Approved</div>
            </div>
            <div class="stat-card red">
                <div class="stat-number">0</div>
                <div class="stat-label">Rejected</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-number">0</div>
                <div class="stat-label">Revision Required</div>
            </div>
        </div>

        <div class="recent-section">
            <h2>Recent Requests</h2>
            <p>No requests submitted yet.</p>
        </div>

        <div class="nav-links">
            <a href="/officer/dashboard.html" class="active">Dashboard</a>
            <a href="/officer/announcements.html">Announcements</a>
            <a href="/officer/all-requests.html">All Requests</a>
            <a href="/officer/societies.html">Manage Societies</a>
            <a href="/officer/reports.html">Reports</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/officer/documents.html">Documents</a>
            <a href="/login.html" class="logout-link">Logout</a>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-dashboard.js"></script>
<script>
(function() {
    const navLinks = document.querySelector('.nav-links');
    if (!navLinks) return;

    const userName = localStorage.getItem('userName') || 'Guest';
    const userRole = localStorage.getItem('userRole') || '';
    const roleLabel = userRole ? userRole.charAt(0).toUpperCase() + userRole.slice(1) : '';
    const userInfo = document.createElement('div');
    userInfo.className = 'nav-user-info';
    userInfo.textContent = userName + (roleLabel ? ' · ' + roleLabel : '');
    userInfo.style.cssText = 'color: #8FA6CC; font-size: 13px; font-weight: 600; width: 100%; margin-bottom: 8px;';
    if (!navLinks.querySelector('.nav-user-info')) {
        navLinks.prepend(userInfo);
    }

    const logoutLink = navLinks.querySelector('a.logout-link');
    if (!logoutLink) return;
    logoutLink.addEventListener('click', function(event) {
        event.preventDefault();
        if (confirm('Are you sure you want to log out?')) {
            localStorage.removeItem('userUid');
            localStorage.removeItem('userRole');
            localStorage.removeItem('userName');
            window.location.href = '/login.html';
        }
    });
})();
</script>
</body>
</html>
