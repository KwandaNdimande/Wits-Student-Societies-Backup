<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Officer Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Times New Roman',serif;background:#f8f9fa;padding:40px}
        .container{max-width:1200px;margin:0 auto}
        .header{margin-bottom:24px}
        .header h1{color:#003B5C;font-size:32px;font-weight:bold}
        .header p{color:#6c757d;margin-top:4px;font-size:16px}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
        .stat-card{padding:24px;border-radius:8px;text-align:center;background:white;border:1px solid #e9ecef}
        .stat-card.blue{background:#ebf5ff;color:#004085}
        .stat-card.yellow{background:#fff3cd;color:#856404}
        .stat-card.green{background:#d4edda;color:#155724}
        .stat-card.red{background:#f8d7da;color:#721c24}
        .stat-number{font-size:36px;font-weight:bold}
        .stat-label{font-size:14px;margin-top:4px}
        .recent-section{border:1px solid #dee2e6;border-radius:8px;padding:24px;background:white}
        .recent-section h2{color:#003B5C;font-size:20px;margin-bottom:8px}
        .recent-section p{color:#6c757d;font-size:14px}
        .nav-links{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
        .nav-links a{color:#003B5C;text-decoration:none;padding:8px 16px;border:1px solid #003B5C;border-radius:6px;font-size:14px;transition:all 0.2s}
        .nav-links a:hover{background:#003B5C;color:white}
        .nav-links a.active{background:#003B5C;color:white}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome back</h1>
            <p>Student Governance Office Dashboard</p>
        </div>
        <div class="stats-grid">
            <div class="stat-card blue">
                <div class="stat-number">0</div>
                <div class="stat-label">Submitted</div>
            </div>
            <div class="stat-card yellow">
                <div class="stat-number">0</div>
                <div class="stat-label">Under Review</div>
            </div>
            <div class="stat-card green">
                <div class="stat-number">0</div>
                <div class="stat-label">Approved</div>
            </div>
            <div class="stat-card red">
                <div class="stat-number">0</div>
                <div class="stat-label">Rejected</div>
            </div>
        </div>
        <div class="recent-section">
            <h2>Recent Requests</h2>
            <p>Connect Firebase to load live data.</p>
        </div>
        <div class="nav-links">
            <a href="/officer/dashboard.html" class="active">Dashboard</a>
            <a href="/officer/announcements.html">Announcements</a>
            <a href="/officer/all-requests.html">All Requests</a>
            <a href="/officer/societies.html">Manage Societies</a>
            <a href="/officer/reports.html">Reports</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/officer/documents.html">Documents</a>
            <a href="/login.html">Logout</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Custom JS -->
    <script src="/js/officer-dashboard.js"></script>
</body>
</html>
