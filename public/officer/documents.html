<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase SDK (for consistency) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --danger: #C0392B;
            --success: #1E8E5A;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 90px 24px 40px 24px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ================================================================
           HEADER
           ================================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header-left p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }
        .btn-upload {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: var(--navy-900);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-upload:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255,255,255,0.15);
        }

        /* ================================================================
           DOCUMENT CARDS
           ================================================================ */
        .doc-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: box-shadow 0.2s ease;
        }
        .doc-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .doc-info {
            flex: 1;
            min-width: 0;
        }
        .doc-name {
            font-weight: 600;
            color: var(--text-900);
            font-size: 16px;
        }
        .doc-description {
            font-size: 13px;
            color: var(--text-500);
            margin-top: 2px;
        }
        .doc-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .btn-action {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-download-doc {
            background: #003B5C;
            color: #fff;
        }
        .btn-download-doc:hover {
            background: #1B3E73;
            transform: translateY(-1px);
        }
        .btn-edit-doc {
            background: var(--navy-900);
            color: #fff;
        }
        .btn-edit-doc:hover {
            background: var(--navy-800);
            transform: translateY(-1px);
        }
        .btn-remove-doc {
            background: var(--danger);
            color: #fff;
        }
        .btn-remove-doc:hover {
            background: #922B21;
            transform: translateY(-1px);
        }

        .no-docs {
            color: #8FA6CC;
            font-size: 14px;
            text-align: center;
            padding: 50px 0;
        }

        /* ================================================================
           MODAL STYLES
           ================================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 640px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .modal-back {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-500);
            padding: 4px 8px;
            font-family: 'Inter', sans-serif;
        }
        .modal-back:hover {
            color: var(--text-900);
        }
        .modal-body {
            padding: 4px 0;
            color: var(--text-900);
        }
        .modal-body .form-group {
            margin-bottom: 16px;
        }
        .modal-body .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-600);
            margin-bottom: 4px;
        }
        .modal-body .form-group input,
        .modal-body .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .modal-body .form-group input:focus,
        .modal-body .form-group textarea:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .modal-body .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-body .form-group .file-hint {
            font-size: 13px;
            color: var(--text-500);
            margin-top: 6px;
        }
        .modal-body .form-group .file-input-wrapper {
            position: relative;
            display: block;
        }
        .modal-body .form-group .file-input-wrapper input[type="file"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--surface);
            width: 100%;
            color: var(--text-600);
        }
        .modal-body .form-group .file-input-wrapper input[type="file"]::file-selector-button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            background: var(--navy-900);
            color: #fff;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-right: 12px;
        }
        .modal-body .form-group .file-input-wrapper input[type="file"]::file-selector-button:hover {
            background: var(--navy-800);
        }

        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--navy-900);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--navy-800);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text-600);
        }
        .btn-secondary:hover {
            background: #d0d7e0;
        }

        /* ================================================================
           TOAST NOTIFICATION
           ================================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--surface);
            color: var(--text-900);
            padding: 16px 24px;
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border-left: 5px solid var(--success);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.4s ease;
            font-size: 14px;
            font-weight: 500;
            max-width: 400px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast .toast-icon {
            font-size: 20px;
        }
        .toast .toast-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-500);
            padding: 0 4px;
        }
        .toast .toast-close:hover {
            color: var(--text-900);
        }

        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 768px) {
            body {
                padding: 80px 16px 20px 16px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-upload {
                text-align: center;
            }
            .doc-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .doc-actions {
                width: 100%;
                flex-wrap: wrap;
            }
            .doc-actions .btn-action {
                flex: 1;
                text-align: center;
                min-width: 60px;
            }
            .modal {
                padding: 20px;
            }
            .toast {
                left: 16px;
                right: 16px;
                bottom: 16px;
                max-width: none;
            }
        }
        @media (max-width: 480px) {
            .doc-actions .btn-action {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>📄 Document Repository</h1>
                <p>Manage documents for all societies</p>
            </div>
            <button class="btn-upload" onclick="openDocumentModal()">➕ Upload Document</button>
        </div>

        <!-- Documents List -->
        <div id="documents-container">
            <div class="no-docs">📭 No documents available.</div>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span class="toast-icon">✅</span>
        <span id="toastMessage">Document saved successfully!</span>
        <button class="toast-close" onclick="closeToast()">✕</button>
    </div>

    <!-- Document Upload / Edit Modal -->
    <div class="modal-overlay" id="documentModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="documentModalTitle">📤 Upload Document</h2>
                <button class="modal-back" onclick="closeDocumentModal()">← Back</button>
            </div>
            <div class="modal-body" id="documentModalBody">
                <div class="form-group">
                    <label for="doc-name">Document Name</label>
                    <input id="doc-name" placeholder="e.g., Budget Template, Constitution, etc." />
                </div>
                <div class="form-group">
                    <label for="doc-description">Description</label>
                    <textarea id="doc-description" placeholder="Brief description of the document..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="doc-file">PDF File</label>
                    <div class="file-input-wrapper">
                        <input id="doc-file" type="file" accept="application/pdf" />
                    </div>
                    <div class="file-hint">📌 Only PDF files are accepted. Max file size: 10MB.</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="documentSaveBtn" onclick="submitDocument()">💾 Save</button>
                <button class="btn btn-secondary" onclick="closeDocumentModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script src="/js/officer-documents.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
