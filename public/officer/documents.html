<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents - Officer Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Times New Roman',serif;background:#f8f9fa;padding:40px}
        .container{max-width:1200px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
        .header h1{color:#003B5C;font-size:32px;font-weight:bold}
        .header p{color:#6c757d;margin-top:4px;font-size:16px}
        .btn-upload{padding:10px 20px;background:#003B5C;color:white;border:none;border-radius:6px;font-size:14px;cursor:pointer;transition:background 0.2s;font-family:'Times New Roman',serif;white-space:nowrap}
        .btn-upload:hover{background:#002a44}
        .doc-card{border:1px solid #dee2e6;border-radius:8px;padding:16px 20px;background:white;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .doc-info{flex:1}
        .doc-name{font-weight:500;color:#003B5C;font-size:16px}
        .doc-description{font-size:14px;color:#6c757d;margin-top:2px}
        .doc-actions{display:flex;gap:8px;flex-shrink:0}
        .btn-download{padding:6px 16px;border:1px solid #003B5C;border-radius:6px;background:transparent;color:#003B5C;font-size:14px;cursor:pointer;transition:all 0.2s;font-family:'Times New Roman',serif}
        .btn-download:hover{background:#003B5C;color:white}
        .btn-remove{padding:6px 16px;border:1px solid #f5c6cb;border-radius:6px;background:transparent;color:#dc3545;font-size:14px;cursor:pointer;transition:all 0.2s;font-family:'Times New Roman',serif}
        .btn-remove:hover{background:#f8d7da}
        .nav-links{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
        .nav-links a{color:#003B5C;text-decoration:none;padding:8px 16px;border:1px solid #003B5C;border-radius:6px;font-size:14px;transition:all 0.2s}
        .nav-links a:hover{background:#003B5C;color:white}
        .nav-links a.active{background:#003B5C;color:white}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Document Repository</h1>
                <p>Manage documents for all societies</p>
            </div>
            <button class="btn-upload" onclick="alert('Upload document functionality coming soon!')">Upload Document</button>
        </div>
        <div id="documents-container"></div>
        <div class="nav-links">
            <a href="/officer/dashboard.html">Dashboard</a>
            <a href="/officer/announcements.html">Announcements</a>
            <a href="/officer/all-requests.html">All Requests</a>
            <a href="/officer/societies.html">Manage Societies</a>
            <a href="/officer/reports.html">Reports</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/officer/documents.html" class="active">Documents</a>
            <a href="/login.html">Logout</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Custom JS -->
    <script src="/js/officer-documents.js"></script>
</body>
</html>
