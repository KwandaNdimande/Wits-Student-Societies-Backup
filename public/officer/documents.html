<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #F3F6FB;
            --surface: #FFFFFF;
            --text-900: #16213E;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --danger: #C0392B;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-900);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .header-left p {
            font-size: 15px;
            color: var(--text-500);
            margin-top: 4px;
        }
        .btn-upload {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: var(--navy-900);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-upload:hover {
            background: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .doc-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(11, 31, 58, 0.04);
        }
        .doc-info {
            flex: 1;
        }
        .doc-name {
            font-weight: 600;
            color: var(--text-900);
            font-size: 16px;
        }
        .doc-description {
            font-size: 13px;
            color: var(--text-500);
            margin-top: 2px;
        }
        .doc-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-download {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text-600);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-download:hover {
            border-color: var(--navy-900);
            color: var(--navy-900);
            background: var(--bg);
        }
        .btn-remove {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border: 1px solid var(--danger);
            border-radius: 8px;
            background: transparent;
            color: var(--danger);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-remove:hover {
            background: var(--danger);
            color: #fff;
        }
        .no-docs {
            color: var(--text-500);
            font-size: 14px;
            text-align: center;
            padding: 40px 0;
        }
        .nav-links {
            margin-top: 28px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--navy-900);
            text-decoration: none;
            padding: 8px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .nav-links a:hover {
            background: var(--navy-900);
            color: #fff;
            border-color: var(--navy-900);
        }
        .nav-links a.active {
            background: var(--navy-900);
            color: #fff;
            border-color: var(--navy-900);
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: var(--text-500);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        @media (max-width: 600px) {
            body { padding: 20px 16px; }
            .header { flex-direction: column; align-items: stretch; }
            .btn-upload { text-align: center; }
            .doc-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .doc-actions { width: 100%; }
            .doc-actions button { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>Document Repository</h1>
                <p>Manage documents for all societies</p>
            </div>
            <button class="btn-upload" onclick="alert('Upload document functionality coming soon!')">Upload Document</button>
        </div>

        <div id="documents-container"></div>

        <div class="nav-links">
            <a href="/officer/dashboard.html">Dashboard</a>
            <a href="/officer/announcements.html">Announcements</a>
            <a href="/officer/all-requests.html">All Requests</a>
            <a href="/officer/societies.html">Manage Societies</a>
            <a href="/officer/reports.html">Reports</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/officer/documents.html" class="active">Documents</a>
            <a href="/login.html">Logout</a>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-documents.js"></script>
</body>
</html>
