<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documents - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --danger: #C0392B;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header-left p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }
        .btn-upload {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: var(--navy-900);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-upload:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255,255,255,0.15);
        }
        .doc-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .doc-info {
            flex: 1;
        }
        .doc-name {
            font-weight: 600;
            color: var(--text-900);
            font-size: 16px;
        }
        .doc-description {
            font-size: 13px;
            color: var(--text-500);
            margin-top: 2px;
        }
        .doc-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-download {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: transparent;
            color: #8FA6CC;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-download:hover {
            border-color: #fff;
            color: #fff;
        }
        .btn-remove {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border: 1px solid var(--danger);
            border-radius: 8px;
            background: transparent;
            color: var(--danger);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-remove:hover {
            background: var(--danger);
            color: #fff;
        }
        .no-docs {
            color: #8FA6CC;
            font-size: 14px;
            text-align: center;
            padding: 40px 0;
        }.wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        @media (max-width: 600px) {
            body { padding: 20px 16px; }
            .header { flex-direction: column; align-items: stretch; }
            .btn-upload { text-align: center; }
            .doc-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .doc-actions { width: 100%; }
            .doc-actions button { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>Document Repository</h1>
                <p>Manage documents for all societies</p>
            </div>
            <button class="btn-upload" onclick="openDocumentModal()">Upload Document</button>
        </div>

        <div id="documents-container"></div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script src="/js/officer-documents.js"></script>
    <script src="/js/shared-nav.js"></script>
<!-- Document Upload / Edit Modal -->
    <div class="modal-overlay" id="documentModal" style="display:none;">
        <div class="modal" style="max-width:640px;">
            <div class="modal-header">
                <button class="modal-back" onclick="closeDocumentModal()" style="background:none;border:none;cursor:pointer;font-size:14px;margin-right:12px;">← Back to Documents</button>
                <h2 id="documentModalTitle">Upload Document</h2>
            </div>
            <div class="modal-body" id="documentModalBody">
                <div style="display:grid;gap:10px;">
                    <input id="doc-name" placeholder="Document name (e.g., Budget Template)" />
                    <textarea id="doc-description" placeholder="Short description" style="min-height:80px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);"></textarea>
                    <input id="doc-file" type="file" accept="application/pdf" />
                    <div style="font-size:13px;color:var(--text-500);">Only PDF files are accepted.</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="documentSaveBtn" onclick="submitDocument()">Save</button>
                <button class="btn btn-secondary" onclick="closeDocumentModal()">Cancel</button>
            </div>
        </div>
    </div>
</body>
</html>
