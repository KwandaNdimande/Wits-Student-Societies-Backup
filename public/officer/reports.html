<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports - Officer Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Times New Roman',serif;background:#f8f9fa;padding:40px}
        .container{max-width:1200px;margin:0 auto}
        .header{margin-bottom:24px}
        .header h1{color:#003B5C;font-size:32px;font-weight:bold}
        .header p{color:#6c757d;margin-top:4px;font-size:16px}
        .controls{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
        .controls select{padding:8px 12px;border:1px solid #ced4da;border-radius:6px;font-size:14px;font-family:Arial,sans-serif;background:white;min-width:200px}
        .controls select:focus{outline:none;border-color:#003B5C;box-shadow:0 0 0 3px rgba(0,59,92,0.1)}
        .btn-export{padding:8px 20px;border:1px solid #003B5C;border-radius:6px;background:transparent;color:#003B5C;font-size:14px;cursor:pointer;transition:all 0.2s;font-family:'Times New Roman',serif}
        .btn-export:hover{background:#003B5C;color:white}
        .btn-export:disabled{opacity:0.5;cursor:not-allowed}
        .no-report{color:#6c757d;font-size:14px}
        .table-container{border:1px solid #dee2e6;border-radius:8px;overflow-x:auto;background:white}
        table{width:100%;border-collapse:collapse;font-size:14px}
        thead{background:#f1f3f5;border-bottom:1px solid #dee2e6}
        th{padding:12px 16px;text-align:left;font-weight:500;color:#6c757d}
        td{padding:12px 16px;border-bottom:1px solid #f1f3f5}
        tr:hover{background:#f8f9fa}
        .nav-links{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
        .nav-links a{color:#003B5C;text-decoration:none;padding:8px 16px;border:1px solid #003B5C;border-radius:6px;font-size:14px;transition:all 0.2s}
        .nav-links a:hover{background:#003B5C;color:white}
        .nav-links a.active{background:#003B5C;color:white}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Reports</h1>
            <p>View and export data reports</p>
        </div>

        <div class="controls">
            <select id="report-select">
                <option value="">Select report type...</option>
                <option value="Budget Request Summary">Budget Request Summary</option>
                <option value="Society Activity Report">Society Activity Report</option>
            </select>
            <button class="btn-export" id="export-btn" disabled onclick="exportReport()">Export</button>
        </div>

        <div id="report-container">
            <p class="no-report">Select a report type to view data.</p>
        </div>

        <div class="nav-links">
            <a href="/officer/dashboard.html">Dashboard</a>
            <a href="/officer/announcements.html">Announcements</a>
            <a href="/officer/all-requests.html">All Requests</a>
            <a href="/officer/societies.html">Manage Societies</a>
            <a href="/officer/reports.html" class="active">Reports</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/officer/documents.html">Documents</a>
            <a href="/login.html">Logout</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Custom JS -->
    <script src="/js/officer-reports.js"></script>
</body>
</html>
