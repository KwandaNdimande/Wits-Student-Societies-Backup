<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Societies - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --wits-blue: #003366;
            --wits-gold: #FFCC00;
            --wits-dark: #002a54;
            --wits-darker: #001f3f;
            --wits-text: #f7f9ff;
            --wits-muted: #a8bbd8;
            --wits-border: rgba(255, 255, 255, 0.12);
            --wits-surface: rgba(0, 51, 102, 0.85);
            --radius: 12px;
            --danger: #ef5350;
            --success: #4CAF50;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--wits-blue);
            color: var(--wits-text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 90px 24px 40px 24px;
            background:
                radial-gradient(circle at 78% 35%, rgba(0, 51, 102, 0.6), transparent 32%),
                radial-gradient(circle at 18% 70%, rgba(0, 51, 102, 0.9), transparent 30%),
                linear-gradient(135deg, #003366 0%, #002a54 55%, #001f3f 100%);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--wits-text);
        }
        .header p {
            font-size: 15px;
            color: var(--wits-muted);
            margin-top: 4px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .controls .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .controls .search-box input {
            padding: 10px 14px;
            border: 1px solid var(--wits-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--wits-text);
            background: rgba(255, 255, 255, 0.06);
            min-width: 250px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .controls .search-box input::placeholder {
            color: var(--wits-muted);
        }
        .controls .search-box input:focus {
            outline: none;
            border-color: var(--wits-gold);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.15);
        }
        .controls .results-count {
            font-size: 13px;
            color: var(--wits-muted);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }
        .filter-button {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--wits-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--wits-border);
        }
        .filter-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .filter-button.active {
            background: var(--wits-gold);
            color: var(--wits-blue);
            border-color: var(--wits-gold);
        }

        .add-section {
            background: rgba(0, 51, 102, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .add-section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--wits-text);
            margin-bottom: 12px;
        }
        .add-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .add-form input,
        .add-form select,
        .add-form textarea {
            padding: 10px 14px;
            border: 1px solid var(--wits-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--wits-text);
            background: rgba(255, 255, 255, 0.06);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .add-form input:focus,
        .add-form select:focus,
        .add-form textarea:focus {
            outline: none;
            border-color: var(--wits-gold);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.15);
        }
        .add-form input::placeholder,
        .add-form select::placeholder,
        .add-form textarea::placeholder {
            color: var(--wits-muted);
        }
        .add-form select option {
            background: var(--wits-blue);
            color: var(--wits-text);
        }
        .add-form textarea {
            resize: vertical;
            min-height: 72px;
            grid-column: 1 / -1;
        }
        .add-form .exec-grid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }
        .add-form .exec-grid .exec-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .add-form .exec-grid .exec-col strong {
            color: var(--wits-text);
            font-size: 13px;
        }
        .req-asterisk {
            color: var(--danger);
            font-weight: 700;
        }
        .field-error {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .field-error.show {
            display: block;
        }
        .input-error {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(239, 83, 80, 0.15) !important;
        }
        .other-portfolios-section {
            grid-column: 1 / -1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--wits-border);
            border-radius: 8px;
            margin: 12px 0;
        }
        .portfolio-item {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--wits-border);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .portfolio-item-content {
            flex: 1;
            display: flex;
            gap: 16px;
        }
        .portfolio-item-field {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .portfolio-item-field label {
            font-size: 11px;
            color: var(--wits-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .portfolio-item-field span {
            color: var(--wits-text);
            font-size: 13px;
            font-weight: 500;
        }
        .btn-remove-portfolio {
            padding: 6px 12px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-remove-portfolio:hover {
            background: #d32f2f;
        }
        .btn-add {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: var(--wits-gold);
            color: var(--wits-blue);
            cursor: pointer;
            transition: all 0.2s ease;
            grid-column: 1 / -1;
            justify-self: start;
        }
        .btn-add:hover {
            background: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .btn-add:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .table-container {
            background: rgba(0, 51, 102, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: rgba(255, 255, 255, 0.06);
            border-bottom: 1px solid var(--wits-border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--wits-muted);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--wits-border);
            color: var(--wits-muted);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        td.strong {
            color: var(--wits-text);
            font-weight: 600;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--wits-muted);
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-top: 1px solid var(--wits-border);
            background: rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination .info {
            font-size: 13px;
            color: var(--wits-muted);
        }
        .pagination .pages {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .pagination .pages button {
            padding: 6px 12px;
            border: 1px solid var(--wits-border);
            border-radius: 6px;
            background: transparent;
            color: var(--wits-muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .pagination .pages button:hover:not(:disabled) {
            border-color: var(--wits-gold);
            color: var(--wits-text);
        }
        .pagination .pages button.active {
            background: var(--wits-gold);
            color: var(--wits-blue);
            border-color: var(--wits-gold);
        }
        .pagination .pages button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .pages .ellipsis {
            color: var(--wits-muted);
            padding: 0 4px;
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: var(--wits-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Action Buttons */
        .btn-action {
            display: inline-block;
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
            margin-right: 6px;
        }
        .btn-action:last-child {
            margin-right: 0;
        }
        .btn-view-society {
            background: var(--wits-gold);
            color: var(--wits-blue);
        }
        .btn-view-society:hover {
            background: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(255, 204, 0, 0.3);
        }
        .btn-edit-society {
            background: rgba(255, 255, 255, 0.15);
            color: var(--wits-text);
            border: 1px solid var(--wits-border);
        }
        .btn-edit-society:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .quota-options { display: flex; flex-direction: column; gap: 8px; }
        .quota-options label { font-size: 14px; color: var(--wits-text); }
        .quota-options input { margin-right: 8px; accent-color: var(--wits-gold); }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: rgba(0, 51, 102, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--wits-border);
            border-radius: var(--radius);
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--wits-border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--wits-text);
            flex: 1;
        }
        .modal-back {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: var(--wits-muted);
            padding: 4px 8px;
            font-family: 'Inter', sans-serif;
        }
        .modal-back:hover {
            color: var(--wits-text);
        }
        .modal-body {
            padding: 4px 0;
            color: var(--wits-text);
        }
        .modal-body .view-detail {
            margin-bottom: 14px;
        }
        .modal-body .view-detail strong {
            display: block;
            font-size: 13px;
            color: var(--wits-muted);
            margin-bottom: 2px;
        }
        .modal-body .view-detail .value {
            font-size: 15px;
            color: var(--wits-text);
        }
        .modal-body .exec-grid-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .modal-body .exec-grid-view .exec-card {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--wits-border);
        }
        .modal-body .exec-grid-view .exec-card strong {
            display: block;
            font-size: 12px;
            color: var(--wits-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 4px;
        }
        .modal-body .exec-grid-view .exec-card .name {
            font-weight: 600;
            color: var(--wits-text);
        }
        .modal-body .exec-grid-view .exec-card .email {
            font-size: 13px;
            color: var(--wits-muted);
        }

        .modal-body .edit-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal-body .edit-grid input,
        .modal-body .edit-grid select,
        .modal-body .edit-grid textarea {
            padding: 10px 14px;
            border: 1px solid var(--wits-border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--wits-text);
            background: rgba(255, 255, 255, 0.06);
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .modal-body .edit-grid input:focus,
        .modal-body .edit-grid select:focus,
        .modal-body .edit-grid textarea:focus {
            outline: none;
            border-color: var(--wits-gold);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.15);
        }
        .modal-body .edit-grid input::placeholder,
        .modal-body .edit-grid select::placeholder,
        .modal-body .edit-grid textarea::placeholder {
            color: var(--wits-muted);
        }
        .modal-body .edit-grid select option {
            background: var(--wits-blue);
            color: var(--wits-text);
        }
        .modal-body .edit-grid textarea {
            grid-column: 1 / -1;
            resize: vertical;
            min-height: 72px;
        }
        .modal-body .edit-grid .full-width {
            grid-column: 1 / -1;
        }
        .modal-body .edit-grid .exec-subgrid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 6px;
        }
        .modal-body .edit-grid .exec-subgrid .exec-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .modal-body .edit-grid .exec-subgrid .exec-col label {
            font-size: 12px;
            font-weight: 600;
            color: var(--wits-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--wits-border);
            display: flex;
            gap: 12px;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--wits-gold);
            color: var(--wits-blue);
        }
        .btn-primary:hover {
            background: #e6b800;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--wits-muted);
            border: 1px solid var(--wits-border);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .btn-archive {
            background: var(--danger);
            color: #fff;
        }
        .btn-archive:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .btn-archive:hover:not(:disabled) {
            background: #d32f2f;
        }

        @media (max-width: 768px) {
            .add-form {
                grid-template-columns: 1fr 1fr;
            }
            .add-form .exec-grid {
                grid-template-columns: 1fr;
            }
            .btn-add {
                grid-column: 1 / -1;
                width: 100%;
                justify-self: stretch;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls .search-box input {
                min-width: auto;
                width: 100%;
            }
            .filter-buttons {
                justify-content: center;
            }
            .pagination {
                flex-direction: column;
                text-align: center;
            }
            .modal {
                padding: 20px;
            }
            .modal-body .exec-grid-view {
                grid-template-columns: 1fr;
            }
            .modal-body .edit-grid {
                grid-template-columns: 1fr;
            }
            .modal-body .edit-grid .exec-subgrid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 80px 16px 20px 16px;
            }
            .btn-action {
                display: block;
                width: 100%;
                margin-right: 0;
                margin-bottom: 4px;
            }
            td .btn-action {
                margin-right: 0 !important;
            }
        }
        @media (max-width: 480px) {
            .add-form { grid-template-columns: 1fr; }
            .add-section { padding: 18px 16px; }
            .table-container { overflow-x: auto; }
            th, td { padding: 10px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Society Profiles</h1>
            <p>Manage all registered societies</p>
        </div>

        <div class="add-section">
            <h2>Add New Society</h2>
            <div class="add-form">
                <input id="society-name" placeholder="Society Name" />
                <select id="society-category">
                    <option value="">Category...</option>
                    <option value="Academic">Academic</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Social">Social</option>
                    <option value="Religious">Religious</option>
                    <option value="Political">Political</option>
                    <option value="Business">Business & Entrepreneur</option>
                </select>
                <input id="society-email" placeholder="Contact Email" />
                <textarea id="society-description" placeholder="Short description of the society"></textarea>

                <div class="exec-grid">
                    <div class="exec-col">
                        <strong>Chairperson <span class="req-asterisk">*</span></strong>
                        <input id="chairperson-name" placeholder="Chairperson Name" />
                        <input id="chairperson-email" placeholder="Chairperson Email" />
                        <div class="field-error" id="chairperson-error"></div>
                    </div>
                    <div class="exec-col">
                        <strong>Deputy Chairperson <span class="req-asterisk">*</span></strong>
                        <input id="deputychairperson-name" placeholder="Deputy Chairperson Name" />
                        <input id="deputychairperson-email" placeholder="Deputy Chairperson Email" />
                        <div class="field-error" id="deputychairperson-error"></div>
                    </div>
                    <div class="exec-col">
                        <strong>Treasurer <span class="req-asterisk">*</span></strong>
                        <input id="treasurer-name" placeholder="Treasurer Name" />
                        <input id="treasurer-email" placeholder="Treasurer Email" />
                        <div class="field-error" id="treasurer-error"></div>
                    </div>
                    <div class="exec-col">
                        <strong>Secretary <span class="req-asterisk">*</span></strong>
                        <input id="secretary-name" placeholder="Secretary Name" />
                        <input id="secretary-email" placeholder="Secretary Email" />
                        <div class="field-error" id="secretary-error"></div>
                    </div>
                    <div class="exec-col">
                        <strong>Organiser <span class="req-asterisk">*</span></strong>
                        <input id="organiser-name" placeholder="Organiser Name" />
                        <input id="organiser-email" placeholder="Organiser Email" />
                        <div class="field-error" id="organiser-error"></div>
                    </div>
                </div>

                <div class="other-portfolios-section">
                    <div style="margin-bottom: 12px;">
                        <strong style="color: var(--wits-text); font-size: 14px;">Optional: Add Other Portfolios</strong>
                    </div>
                    <div id="other-portfolios-add" style="display: flex; gap: 8px; margin-bottom: 12px;">
                        <input id="other-portfolio-title" placeholder="Portfolio Title" style="flex: 1; padding: 10px 14px; border: 1px solid var(--wits-border); border-radius: 8px; font-size: 14px; background: rgba(255,255,255,0.06); color: var(--wits-text);" />
                        <input id="other-portfolio-name" placeholder="Member Name" style="flex: 1; padding: 10px 14px; border: 1px solid var(--wits-border); border-radius: 8px; font-size: 14px; background: rgba(255,255,255,0.06); color: var(--wits-text);" />
                        <input id="other-portfolio-email" placeholder="Member Email" style="flex: 1; padding: 10px 14px; border: 1px solid var(--wits-border); border-radius: 8px; font-size: 14px; background: rgba(255,255,255,0.06); color: var(--wits-text);" />
                        <button type="button" onclick="addOtherPortfolio()" style="padding: 10px 20px; background: var(--wits-gold); color: var(--wits-blue); border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">Add</button>
                    </div>
                    <div id="other-portfolios-list"></div>
                </div>

                <button class="btn-add" onclick="addSociety()">Add Society</button>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="🔍 Search societies..." oninput="searchSocieties()" />
            </div>
            <div class="filter-buttons">
                <button class="filter-button active" data-society-filter="active" onclick="setSocietyFilter('active')">Active</button>
                <button class="filter-button" data-society-filter="archived" onclick="setSocietyFilter('archived')">Archived</button>
                <button class="filter-button" data-society-filter="all" onclick="setSocietyFilter('all')">All</button>
            </div>
            <div class="results-count" id="resultsCount">Showing 0 of 0 societies</div>
        </div>

        <div id="societies-container"></div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Society Modal -->
    <div class="modal-overlay" id="societyModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="societyModalTitle">Society</h2>
                <button class="modal-back" onclick="closeSocietyModal()">← Back to Societies</button>
            </div>
            <div class="modal-body" id="societyModalBody">
                Loading...
            </div>
            <div class="modal-footer">
                <button class="btn btn-archive" id="societyArchiveBtn" onclick="archiveSociety(document.getElementById('societyModal').dataset.viewingId)" style="display:none;" disabled>Archive</button>
                <button class="btn btn-primary" id="societySaveBtn" onclick="saveSocietyEdits()" style="display:none;">Save Changes</button>
                <button class="btn btn-secondary" onclick="closeSocietyModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-societies.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
