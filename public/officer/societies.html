<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Societies - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase SDK (for consistency) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --danger: #C0392B;
            --success: #1E8E5A;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 90px 24px 40px 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .controls .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .controls .search-box input {
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #fff;
            background: rgba(255,255,255,0.06);
            min-width: 250px;
            transition: border-color 0.2s;
        }
        .controls .search-box input::placeholder {
            color: #8FA6CC;
        }
        .controls .search-box input:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
        }
        .controls .results-count {
            font-size: 13px;
            color: #8FA6CC;
        }

        /* ===== FILTER BUTTONS (styled like Add Society button) ===== */
        .filter-buttons {
            display: flex;
            gap: 8px;
        }
        .filter-button {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: #E9ECEF;
            color: var(--text-600);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-button:hover {
            background: #DEE2E6;
        }
        .filter-button.active {
            background: var(--navy-900);
            color: #fff;
        }
        .filter-button.active:hover {
            background: var(--navy-800);
        }

        .add-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .add-section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy-900);
            margin-bottom: 12px;
        }
        .add-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .add-form input,
        .add-form select,
        .add-form textarea {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
        }
        .add-form input:focus,
        .add-form select:focus,
        .add-form textarea:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .add-form textarea {
            resize: vertical;
            min-height: 72px;
            grid-column: 1 / -1;
        }
        .add-form .exec-grid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }
        .add-form .exec-grid .exec-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .add-form .exec-grid .exec-col strong {
            color: var(--text-900);
            font-size: 13px;
        }
        .req-asterisk {
            color: var(--danger);
            font-weight: 700;
        }
        .field-error {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .field-error.show {
            display: block;
        }
        .input-error {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.15) !important;
        }
        .other-portfolios-section {
            grid-column: 1 / -1;
            padding: 12px;
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin: 12px 0;
        }
        .portfolio-item {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .portfolio-item-content {
            flex: 1;
            display: flex;
            gap: 16px;
        }
        .portfolio-item-field {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .portfolio-item-field label {
            font-size: 11px;
            color: var(--text-500);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .portfolio-item-field span {
            color: var(--text-900);
            font-size: 13px;
            font-weight: 500;
        }
        .btn-remove-portfolio {
            padding: 6px 12px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-remove-portfolio:hover {
            background: #922b21;
        }
        .btn-add {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: var(--navy-900);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            grid-column: 1 / -1;
            justify-self: start;
        }
        .btn-add:hover {
            background: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .btn-add:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: #FAFBFD;
            border-bottom: 1px solid var(--border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-500);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-600);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: #FAFBFD;
        }
        td.strong {
            color: var(--text-900);
            font-weight: 600;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-500);
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-top: 1px solid var(--border);
            background: #FAFBFD;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination .info {
            font-size: 13px;
            color: var(--text-500);
        }
        .pagination .pages {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .pagination .pages button {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text-600);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .pagination .pages button:hover:not(:disabled) {
            border-color: var(--navy-900);
            color: var(--navy-900);
        }
        .pagination .pages button.active {
            background: var(--navy-900);
            color: #fff;
            border-color: var(--navy-900);
        }
        .pagination .pages button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .pages .ellipsis {
            color: var(--text-500);
            padding: 0 4px;
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* ================================================================
           ACTION BUTTONS (View, Edit)
           ================================================================ */

        .btn-action {
            display: inline-block;
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
            margin-right: 6px;
        }
        .btn-action:last-child {
            margin-right: 0;
        }

        /* View button - Blue */
        .btn-view-society {
            background: #2E6FBA;
            color: #fff;
        }
        .btn-view-society:hover {
            background: #1B4F8A;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(46, 111, 186, 0.3);
        }

        /* Edit button - Navy */
        .btn-edit-society {
            background: #0B1F3A;
            color: #fff;
        }
        .btn-edit-society:hover {
            background: #1B3E73;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(11, 31, 58, 0.3);
        }

        .quota-options { display: flex; flex-direction: column; gap: 8px; }
        .quota-options label { font-size: 14px; color: var(--text-900); }
        .quota-options input { margin-right: 8px; }

        /* ================================================================
           MODAL STYLES (with backdrop blur)
           ================================================================ */

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 700px;
                    .modal {
                        max-width: 90%;
                        max-height: 90vh;
                        overflow-y: auto;
                    }
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
            flex: 1;
        }
        .modal-back {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-500);
            padding: 4px 8px;
            font-family: 'Inter', sans-serif;
        }
        .modal-back:hover {
            color: var(--text-900);
        }
        .modal-body {
            padding: 4px 0;
            color: var(--text-900);
        }
        .modal-body .view-detail {
            margin-bottom: 14px;
        }
        .modal-body .view-detail strong {
            display: block;
            font-size: 13px;
            color: var(--text-500);
            margin-bottom: 2px;
        }
        .modal-body .view-detail .value {
            font-size: 15px;
            color: var(--text-900);
        }
        .modal-body .exec-grid-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .modal-body .exec-grid-view .exec-card {
            background: #FAFBFD;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .modal-body .exec-grid-view .exec-card strong {
            display: block;
            font-size: 12px;
            color: var(--text-500);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 4px;
        }
        .modal-body .exec-grid-view .exec-card .name {
            font-weight: 600;
            color: var(--text-900);
        }
        .modal-body .exec-grid-view .exec-card .email {
            font-size: 13px;
            color: var(--text-500);
        }

        /* Edit form inside modal */
        .modal-body .edit-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal-body .edit-grid input,
        .modal-body .edit-grid select,
        .modal-body .edit-grid textarea {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
            width: 100%;
        }
        .modal-body .edit-grid input:focus,
        .modal-body .edit-grid select:focus,
        .modal-body .edit-grid textarea:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .modal-body .edit-grid textarea {
            grid-column: 1 / -1;
            resize: vertical;
            min-height: 72px;
        }
        .modal-body .edit-grid .full-width {
            grid-column: 1 / -1;
        }
        .modal-body .edit-grid .exec-subgrid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 6px;
        }
        .modal-body .edit-grid .exec-subgrid .exec-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .modal-body .edit-grid .exec-subgrid .exec-col label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-500);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--navy-900);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--navy-800);
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text-600);
        }
        .btn-secondary:hover {
            background: #d0d7e0;
                .form-buttons {
                    display: flex;
                    gap: 12px;
                    grid-column: 1 / -1;
                }
                .form-buttons .btn-add,
                .form-buttons .btn-cancel {
                    grid-column: auto;
                    justify-self: auto;
                }
                .btn-cancel {
                    font-family: 'Inter', sans-serif;
                    font-size: 14px;
                    font-weight: 600;
                    padding: 10px 28px;
                    border: none;
                    border-radius: 8px;
                    background: var(--border);
                    color: var(--text-600);
                    cursor: pointer;
                    transition: all 0.2s ease;
                }
                .btn-cancel:hover {
                    background: #d0d7e0;
                    transform: translateY(-1px);
                }
        }
        .btn-archive { background: var(--danger); color: #fff; }
        .btn-archive:disabled { opacity: 0.45; cursor: not-allowed; }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 768px) {
            .add-form {
                grid-template-columns: 1fr 1fr;
            }
            .add-form .exec-grid {
                grid-template-columns: 1fr;
            }
            .btn-add {
                grid-column: 1 / -1;
                width: 100%;
                justify-self: stretch;
                        .form-buttons {
                            flex-direction: column;
                        }
                        .form-buttons .btn-add,
                        .form-buttons .btn-cancel {
                            width: 100%;
                        }
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
                        .table-container {
                            overflow-x: auto;
                        }
                        table {
                            width: 100%;
                            min-width: 600px;
                        }
            }
            .controls .search-box input {
                min-width: auto;
                width: 100%;
            }
            .filter-buttons {
                justify-content: center;
            }
            .pagination {
                flex-direction: column;
                text-align: center;
            }
            .modal {
                padding: 20px;
            }
            .modal-body .exec-grid-view {
                grid-template-columns: 1fr;
            }
            .modal-body .edit-grid {
                grid-template-columns: 1fr;
            }
            .modal-body .edit-grid .exec-subgrid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 80px 16px 20px 16px;
            }
            .btn-action {
                display: block;
                width: 100%;
                margin-right: 0;
                margin-bottom: 4px;
            }
            td .btn-action {
                margin-right: 0 !important;
            }
        }
        @media (max-width: 480px) {
            .add-form { grid-template-columns: 1fr; }
            .add-section { padding: 18px 16px; }
            .table-container { overflow-x: auto; }
            th, td { padding: 10px 12px; font-size: 13px; }
                    .modal {
                        max-width: 95%;
                        padding: 16px;
                    }
                    .form-buttons {
                        flex-direction: column;
                        gap: 8px;
                    }
                    .form-buttons .btn-add,
                    .form-buttons .btn-cancel {
                        width: 100%;
                        padding: 10px 16px;
                        font-size: 13px;
                    }
                    .btn-action {
                        font-size: 11px;
                        padding: 6px 10px;
                    }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Society Profiles</h1>
            <p>Manage all registered societies</p>
        </div>

        <div class="add-section">
            <h2>Add New Society</h2>
            <div class="add-form">
                <input id="society-name" placeholder="Society Name" />
                <select id="society-category">
                    <option value="">Category...</option>
                    <option value="Academic">Academic</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Social">Social</option>
                    <option value="Religious">Religious</option>
                    <option value="Political">Political</option>
                    <option value="Business">Business & Entrepreneur</option>
                </select>
                <input id="society-email" placeholder="Contact Email" />
                <textarea id="society-description" placeholder="Short description of the society"></textarea>

                <div class="exec-grid">
                    <div class="exec-col">
                        <strong>Chairperson <span class="req-asterisk">*</span></strong>
                        <input id="chairperson-name" placeholder="Chairperson Name" />
                        <input id="chairperson-email" placeholder="Chairperson Email" />
                        <div class="field-error" id="chairperson-error"></div>
                    </div>
                    <div class="exec-col">
                        <strong>Deputy Chairperson <span class="req-asterisk">*</span></strong>
                        <input id="deputychairperson-name" placeholder="Deputy Chairperson Name" />
                        <input id="deputychairperson-email" placeholder="Deputy Chairperson Email" />
                        <div class="field-error" id="deputychairperson-error"></div>
                    </div>
                    <div class="exec-col">
                        <strong>Treasurer <span class="req-asterisk">*</span></strong>
                        <input id="treasurer-name" placeholder="Treasurer Name" />
                        <input id="treasurer-email" placeholder="Treasurer Email" />
                        <div class="field-error" id="treasurer-error"></div>
                    </div>
                    <div class="exec-col">
                        <strong>Secretary <span class="req-asterisk">*</span></strong>
                        <input id="secretary-name" placeholder="Secretary Name" />
                        <input id="secretary-email" placeholder="Secretary Email" />
                        <div class="field-error" id="secretary-error"></div>
                    </div>
                    <div class="exec-col">
                        <strong>Organiser <span class="req-asterisk">*</span></strong>
                        <input id="organiser-name" placeholder="Organiser Name" />
                        <input id="organiser-email" placeholder="Organiser Email" />
                        <div class="field-error" id="organiser-error"></div>
                    </div>
                </div>

                <div class="other-portfolios-section">
                    <div style="margin-bottom: 12px;">
                        <strong style="color: var(--text-900); font-size: 14px;">Optional: Add Other Portfolios</strong>
                    </div>
                    <div id="other-portfolios-add" style="display: flex; gap: 8px; margin-bottom: 12px;">
                        <input id="other-portfolio-title" placeholder="Portfolio Title" style="flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;" />
                        <input id="other-portfolio-name" placeholder="Member Name" style="flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;" />
                        <input id="other-portfolio-email" placeholder="Member Email" style="flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;" />
                        <button type="button" onclick="addOtherPortfolio()" style="padding: 10px 20px; background: var(--blue-600); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">Add</button>
                    </div>
                    <div id="other-portfolios-list"></div>
                </div>

                <div class="form-buttons">
                    <button class="btn-add" onclick="addSociety()">Add Society</button>
                    <button type="button" class="btn-cancel" onclick="cancelAddSociety()">Cancel</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="🔍 Search societies..." oninput="searchSocieties()" />
            </div>
            <div class="filter-buttons" aria-label="Society status filter">
                <button class="filter-button active" data-society-filter="active" onclick="setSocietyFilter('active')">Active</button>
                <button class="filter-button" data-society-filter="archived" onclick="setSocietyFilter('archived')">Archived</button>
                <button class="filter-button" data-society-filter="all" onclick="setSocietyFilter('all')">All</button>
            </div>
            <div class="results-count" id="resultsCount">Showing 0 of 0 societies</div>
        </div>

        <div id="societies-container"></div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Society Modal -->
    <div class="modal-overlay" id="societyModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="societyModalTitle">Society</h2>
                <button class="modal-back" onclick="closeSocietyModal()">← Back to Societies</button>
            </div>
            <div class="modal-body" id="societyModalBody">
                Loading...
            </div>
            <div class="modal-footer">
                <button class="btn btn-archive" id="societyArchiveBtn" onclick="archiveSociety(document.getElementById('societyModal').dataset.viewingId)" style="display:none;" disabled>Archive</button>
                <button class="btn btn-primary" id="societySaveBtn" onclick="saveSocietyEdits()" style="display:none;">Save Changes</button>
                <button class="btn btn-secondary" onclick="closeSocietyModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-societies.js"></script>
    <script src="/js/shared-nav.js"></script>
</body>
</html>
