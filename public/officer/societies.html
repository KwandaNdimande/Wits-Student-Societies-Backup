<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Society Profiles - Officer Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Times New Roman',serif;background:#f8f9fa;padding:40px}.container{max-width:1200px;margin:0 auto}.header{margin-bottom:24px}.header h1{color:#003B5C;font-size:32px;font-weight:bold}.header p{color:#6c757d;margin-top:4px;font-size:16px}.add-section{border:1px solid #dee2e6;border-radius:8px;padding:20px;background:white;margin-bottom:24px}.add-section h2{color:#003B5C;font-size:18px;margin-bottom:12px}.add-form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.add-form input,.add-form select{padding:8px 12px;border:1px solid #ced4da;border-radius:6px;font-size:14px;font-family:Arial,sans-serif}.add-form input:focus,.add-form select:focus{outline:none;border-color:#003B5C;box-shadow:0 0 0 3px rgba(0,59,92,0.1)}.btn-add{padding:10px 20px;background:#003B5C;color:white;border:none;border-radius:6px;font-size:14px;cursor:pointer;transition:background 0.2s;font-family:'Times New Roman',serif;grid-column:1/-1;justify-self:start}.btn-add:hover{background:#002a44}.societies-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.society-card{border:1px solid #dee2e6;border-radius:8px;padding:16px 20px;background:white}.society-header{display:flex;justify-content:space-between;align-items:flex-start}.society-name{font-weight:600;color:#003B5C;font-size:18px}.society-category{font-size:14px;color:#6c757d}.society-email{font-size:14px;color:#6c757d}.btn-delete{font-size:12px;color:#dc3545;background:none;border:none;cursor:pointer;font-family:'Times New Roman',serif}.btn-delete:hover{color:#a71d2a}.nav-links{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}.nav-links a{color:#003B5C;text-decoration:none;padding:8px 16px;border:1px solid #003B5C;border-radius:6px;font-size:14px;transition:all 0.2s}.nav-links a:hover{background:#003B5C;color:white}.nav-links a.active{background:#003B5C;color:white}@media(max-width:768px){.add-form{grid-template-columns:1fr}.btn-add{grid-column:1;width:100%}}</style></head>
<body><div class="container"><div class="header"><h1>Society Profiles</h1><p>Manage all registered societies</p></div><div class="add-section"><h2>Add New Society</h2><div class="add-form"><input id="society-name" placeholder="Society Name" /><select id="society-category"><option value="">Category...</option><option value="Academic">Academic</option><option value="Cultural">Cultural</option><option value="Sports">Sports</option><option value="Religious">Religious</option><option value="Other">Other</option></select><input id="society-email" placeholder="Contact Email" /><button class="btn-add" onclick="addSociety()">Add Society</button></div></div><div id="societies-container" class="societies-grid"></div><div class="nav-links"><a href="/officer/dashboard.html">Dashboard</a><a href="/officer/announcements.html">Announcements</a><a href="/officer/all-requests.html">All Requests</a><a href="/officer/societies.html" class="active">Manage Societies</a><a href="/officer/reports.html">Reports</a><a href="/chatbot.html">SGO Assistant</a><a href="/officer/documents.html">Documents</a><a href="/login.html">Logout</a></div></div><script>let societies=[{id:1,name:"Wits Debating Union",category:"Academic",email:"debating@wits.ac.za"},{id:2,name:"Wits CS Club",category:"Academic",email:"csclub@wits.ac.za"}];function renderSocieties(){const container=document.getElementById('societies-container');if(societies.length===0){container.innerHTML='<div style="text-align:center;padding:40px;color:#6c757d;grid-column:1/-1;">No societies registered yet.</div>';return;}container.innerHTML=societies.map(s=>`<div class="society-card"><div class="society-header"><h3 class="society-name">${s.name}</h3><button class="btn-delete" onclick="deleteSociety(${s.id})">Delete</button></div><p class="society-category">${s.category}</p><p class="society-email">${s.email}</p></div>`).join('');}function addSociety(){const name=document.getElementById('society-name').value.trim();const category=document.getElementById('society-category').value;const email=document.getElementById('society-email').value.trim();if(!name||!category||!email){alert('Please fill in all fields.');return;}societies=[...societies,{id:Date.now(),name,category,email}];renderSocieties();document.getElementById('society-name').value='';document.getElementById('society-category').value='';document.getElementById('society-email').value='';}function deleteSociety(id){if(!confirm('Are you sure you want to delete this society? This cannot be undone.'))return;societies=societies.filter(s=>s.id!==id);renderSocieties();}renderSocieties();</script></body></html>
