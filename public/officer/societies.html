<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Societies - Officer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --danger: #C0392B;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }
        .header p {
            font-size: 15px;
            color: #8FA6CC;
            margin-top: 4px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .controls .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .controls .search-box input {
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #fff;
            background: rgba(255,255,255,0.06);
            min-width: 250px;
            transition: border-color 0.2s;
        }
        .controls .search-box input::placeholder {
            color: #8FA6CC;
        }
        .controls .search-box input:focus {
            outline: none;
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
        }
        .controls .results-count {
            font-size: 13px;
            color: #8FA6CC;
        }
        .add-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .add-section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy-900);
            margin-bottom: 12px;
        }
        .add-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .add-form input,
        .add-form select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
        }
        .add-form input:focus,
        .add-form select:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .btn-add {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: var(--navy-900);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            grid-column: 1 / -1;
            justify-self: start;
        }
        .btn-add:hover {
            background: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .btn-add:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: #FAFBFD;
            border-bottom: 1px solid var(--border);
        }
        th {
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-500);
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-600);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: #FAFBFD;
        }
        td.strong {
            color: var(--text-900);
            font-weight: 600;
        }
        .btn-delete {
            font-size: 12px;
            color: var(--danger);
            background: none;
            border: 1px solid var(--danger);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-500);
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-top: 1px solid var(--border);
            background: #FAFBFD;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination .info {
            font-size: 13px;
            color: var(--text-500);
        }
        .pagination .pages {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .pagination .pages button {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text-600);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .pagination .pages button:hover:not(:disabled) {
            border-color: var(--navy-900);
            color: var(--navy-900);
        }
        .pagination .pages button.active {
            background: var(--navy-900);
            color: #fff;
            border-color: var(--navy-900);
        }
        .pagination .pages button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .pages .ellipsis {
            color: var(--text-500);
            padding: 0 4px;
        }
        .nav-links {
            margin-top: 28px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #8FA6CC;
            text-decoration: none;
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }
        .nav-links a.active {
            background: #fff;
            color: var(--navy-900);
            border-color: #fff;
        }
        .wits-badge {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #8FA6CC;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .add-form {
                grid-template-columns: 1fr 1fr;
            }
            .btn-add {
                grid-column: 1 / -1;
                width: 100%;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .controls .search-box input {
                min-width: auto;
                width: 100%;
            }
            .pagination {
                flex-direction: column;
                text-align: center;
            }
        }
        @media (max-width: 480px) {
            body { padding: 20px 16px; }
            .add-form { grid-template-columns: 1fr; }
            .add-section { padding: 18px 16px; }
            .table-container { overflow-x: auto; }
            th, td { padding: 10px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Society Profiles</h1>
            <p>Manage all registered societies</p>
        </div>

        <div class="add-section">
            <h2>Add New Society</h2>
            <div class="add-form">
                <input id="society-name" placeholder="Society Name" />
                <select id="society-category">
                    <option value="">Category...</option>
                    <option value="Academic">Academic</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Sports">Sports</option>
                    <option value="Religious">Religious</option>
                    <option value="Other">Other</option>
                </select>
                <input id="society-email" placeholder="Contact Email" />
                <button class="btn-add" onclick="addSociety()">Add Society</button>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input id="searchInput" type="text" placeholder="🔍 Search societies..." oninput="searchSocieties()" />
            </div>
            <div class="results-count" id="resultsCount">Showing 0 of 0 societies</div>
        </div>

        <div id="societies-container"></div>

        <div class="nav-links">
            <a href="/officer/dashboard.html">Dashboard</a>
            <a href="/officer/announcements.html">Announcements</a>
            <a href="/officer/all-requests.html">All Requests</a>
            <a href="/officer/societies.html" class="active">Manage Societies</a>
            <a href="/officer/reports.html">Reports</a>
            <a href="/chatbot.html">SGO Assistant</a>
            <a href="/officer/documents.html">Documents</a>
            <a href="/login.html" class="logout-link">Logout</a>
        </div>

        <div class="wits-badge">University of the Witwatersrand</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="/js/officer-societies.js"></script>
<script>
(function() {
    const navLinks = document.querySelector('.nav-links');
    if (!navLinks) return;

    const userName = localStorage.getItem('userName') || 'Guest';
    const userRole = localStorage.getItem('userRole') || '';
    const roleLabel = userRole ? userRole.charAt(0).toUpperCase() + userRole.slice(1) : '';
    const userInfo = document.createElement('div');
    userInfo.className = 'nav-user-info';
    userInfo.textContent = userName + (roleLabel ? ' · ' + roleLabel : '');
    userInfo.style.cssText = 'color: #8FA6CC; font-size: 13px; font-weight: 600; width: 100%; margin-bottom: 8px;';
    if (!navLinks.querySelector('.nav-user-info')) {
        navLinks.prepend(userInfo);
    }

    const logoutLink = navLinks.querySelector('a.logout-link');
    if (!logoutLink) return;
    logoutLink.addEventListener('click', function(event) {
        event.preventDefault();
        if (confirm('Are you sure you want to log out?')) {
            localStorage.removeItem('userUid');
            localStorage.removeItem('userRole');
            localStorage.removeItem('userName');
            window.location.href = '/login.html';
        }
    });
})();
</script>
</body>
</html>
