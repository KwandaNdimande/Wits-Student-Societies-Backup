<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Wits Student Societies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #F3F6FB;
            --surface: #FFFFFF;
            --text-900: #16213E;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --error: #C0392B;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-900);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 440px;
            width: 100%;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 36px;
            box-shadow: 0 8px 32px rgba(11, 31, 58, 0.06);
        }
        .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px rgba(19, 49, 92, 0.2);
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--navy-900);
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-500);
            text-align: center;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-600);
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .form-group input::placeholder {
            color: var(--text-500);
        }
        .name-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn {
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.01em;
        }
        .btn-primary {
            background: var(--navy-900);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            color: var(--error);
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-500);
        }
        .footer-link a {
            color: var(--navy-900);
            font-weight: 600;
            text-decoration: none;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 24px 0 20px;
        }
        .wits-badge {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-500);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
            }
            .name-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">SGO</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join Wits Student Societies</p>

            <form id="register-form">
                <div class="name-grid">
                    <div class="form-group">
                        <label for="firstName">First name</label>
                        <input id="firstName" type="text" placeholder="Jane" required />
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last name</label>
                        <input id="lastName" type="text" placeholder="Doe" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="society-name">Society Name</label>
                    <input id="society-name" type="text" placeholder="e.g. Wits Debate Society" required />
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input id="signup-email" type="email" placeholder="studentnumber@students.wits.ac.za" required />
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input id="signup-password" type="password" placeholder="Create a password (min 6 characters)" required />
                </div>

                <div id="register-error" class="error-message"></div>

                <button type="submit" class="btn btn-primary" id="register-btn">Create account</button>
            </form>

            <hr class="divider">

            <div class="footer-link">
                Already have an account? <a href="/login.html">Sign in</a>
            </div>

            <div class="wits-badge">University of the Witwatersrand</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsWp91SrNnlVHoyJWJyxjvXgGY6debDLE",
            authDomain: "wits-student-societies-backup.firebaseapp.com",
            projectId: "wits-student-societies-backup",
            storageBucket: "wits-student-societies-backup.firebasestorage.app",
            messagingSenderId: "111338778369",
            appId: "1:111338778369:web:5633595cd3fec3113c3500",
            measurementId: "G-D01M5HWGOV"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isRegistering = false;

        function getFriendlyErrorMessage(errorCode) {
            const messages = {
                'auth/email-already-in-use': 'This email is already registered. Please sign in instead.',
                'auth/invalid-email': 'The email address is not valid. Please check and try again.',
                'auth/weak-password': 'Password is too weak. Please use at least 6 characters.',
                'auth/network-request-failed': 'Network error. Please check your internet connection.',
                'auth/internal-error': 'Something went wrong. Please try again.'
            };
            return messages[errorCode] || 'Unable to create account. Please try again.';
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            isRegistering = true;

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const societyName = document.getElementById('society-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const errorEl = document.getElementById('register-error');
            const btn = document.getElementById('register-btn');

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                // Step 1: Create user in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Step 2: Generate OTP
                const otpCode = Math.floor(100000 + Math.random() * 900000).toString();
                const expiresAt = new Date();
                expiresAt.setMinutes(expiresAt.getMinutes() + 15);

                // Step 3: Save OTP to emailVerifications collection
                await db.collection('emailVerifications').doc(user.uid).set({
                    userId: user.uid,
                    email: email,
                    code: otpCode,
                    expiresAt: expiresAt,
                    createdAt: new Date(),
                    verified: false
                });

                // Step 4: Save user data to Firestore (UNVERIFIED)
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    email: email,
                    firstName: firstName,
                    lastName: lastName,
                    societyName: societyName,
                    role: 'leader',
                    isEmailVerified: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Step 5: Check if society exists, if not create it
                const existingSociety = await db.collection('societies')
                    .where('name', '==', societyName)
                    .get();

                if (existingSociety.empty) {
                    await db.collection('societies').add({
                        name: societyName,
                        category: 'General',
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    console.log('✅ Society created:', societyName);
                }

                // Step 6: Store pending info in localStorage
                localStorage.setItem('pendingUserId', user.uid);
                localStorage.setItem('pendingUserEmail', email);
                localStorage.setItem('pendingUserName', firstName + ' ' + lastName);

                // Step 7: Log OTP for testing
                console.log('=========================================');
                console.log('VERIFICATION CODE FOR:', email);
                console.log('CODE:', otpCode);
                console.log('Expires at:', expiresAt.toLocaleTimeString());
                console.log('=========================================');

                // Step 8: Send email via backend
                try {
                    const emailResponse = await fetch('/api/send-verification-email', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: email,
                            code: otpCode,
                            name: firstName + ' ' + lastName
                        }),
                    });

                    if (emailResponse.ok) {
                        console.log('Verification email sent successfully');
                    } else {
                        console.error('Failed to send verification email');
                    }
                } catch (emailError) {
                    console.error('Email sending error:', emailError);
                }

                // Step 9: Sign out user
                await auth.signOut();

                // Step 10: Redirect to verification page
                errorEl.style.display = 'none';
                btn.textContent = '✅ Check your email!';
                btn.style.background = '#28a745';

                setTimeout(() => {
                    window.location.href = '/verify-otp.html';
                }, 1500);

            } catch (err) {
                console.error('Registration error:', err);
                const friendlyMessage = getFriendlyErrorMessage(err.code);
                errorEl.textContent = friendlyMessage;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create account';
                isRegistering = false;
            }
        });
    </script>
</body>
</html>
