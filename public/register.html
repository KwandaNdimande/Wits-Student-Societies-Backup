<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Wits Student Societies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
            --error: #C0392B;
            --shadow: 0 8px 32px rgba(0,0,0,0.18);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 440px;
            width: 100%;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 36px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }
        .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px rgba(46, 111, 186, 0.3);
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--navy-900);
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-500);
            text-align: center;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-600);
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
        }
        /* Ensure name inputs also have rounded corners */
        .name-grid input {
            border-radius: 8px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .form-group input::placeholder {
            color: var(--text-500);
        }
        /* ---- Society input with browse button ---- */
        .society-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .dropdown-wrapper {
            position: relative;
            flex: 1;
        }
        .dropdown-wrapper input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
        }
        .dropdown-wrapper input:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .dropdown-wrapper input::placeholder {
            color: var(--text-500);
        }
        .browse-btn {
            flex-shrink: 0;
            padding: 10px 16px;
            background: var(--blue-600);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .browse-btn:hover {
            background: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .dropdown-list {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 100;
            padding: 6px 0;
            list-style: none;
            margin: 0;
        }
        .dropdown-list.open {
            display: block;
        }
        .dropdown-list li {
            padding: 10px 14px;
            font-size: 14px;
            color: var(--text-900);
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #f0f0f0;
        }
        .dropdown-list li:last-child {
            border-bottom: none;
        }
        .dropdown-list li:hover,
        .dropdown-list li.active {
            background: #F4F7FB;
        }
        .dropdown-list li.no-results {
            color: var(--text-500);
            font-style: italic;
            cursor: default;
        }
        .dropdown-list li.no-results:hover {
            background: transparent;
        }
        .dropdown-hint {
            font-size: 12px;
            color: var(--text-500);
            margin-top: 4px;
        }
        /* ---- other inputs ---- */
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
        }
        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .form-group input[type="email"]::placeholder,
        .form-group input[type="password"]::placeholder {
            color: var(--text-500);
        }
        .name-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn {
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.01em;
        }
        .btn-primary {
            background: var(--navy-900);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--navy-800);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            color: var(--error);
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-500);
        }
        .footer-link a {
            color: var(--navy-900);
            font-weight: 600;
            text-decoration: none;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 24px 0 20px;
        }
        .wits-badge {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-500);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* ---- Modal styles ---- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 48px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy-900);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-500);
            cursor: pointer;
            padding: 0 8px;
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: var(--text-900);
        }
        .modal-search {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .modal-search input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-900);
            background: var(--surface);
            transition: border-color 0.2s;
        }
        .modal-search input:focus {
            outline: none;
            border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .modal-search input::placeholder {
            color: var(--text-500);
        }
        .modal-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            list-style: none;
            margin: 0;
        }
        .modal-list li {
            padding: 12px 24px;
            cursor: pointer;
            font-size: 15px;
            color: var(--text-900);
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
        }
        .modal-list li:last-child {
            border-bottom: none;
        }
        .modal-list li:hover {
            background: #F4F7FB;
        }
        .modal-list li.no-results {
            color: var(--text-500);
            font-style: italic;
            cursor: default;
            text-align: center;
            padding: 30px 0;
        }
        .modal-list li.no-results:hover {
            background: transparent;
        }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            flex-shrink: 0;
        }
        .modal-footer .load-more-btn {
            padding: 8px 24px;
            background: var(--blue-600);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-footer .load-more-btn:hover {
            background: var(--navy-800);
        }
        .modal-footer .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .modal-footer .load-more-btn.hidden {
            display: none;
        }
        .modal-footer .loading-text {
            color: var(--text-500);
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            .name-grid { grid-template-columns: 1fr; }
            .society-row { flex-wrap: wrap; }
            .browse-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">SGO</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join Wits Student Societies</p>

            <form id="register-form">
                <div class="name-grid">
                    <div class="form-group">
                        <label for="firstName">First name</label>
                        <input id="firstName" type="text" placeholder="Jane" required />
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last name</label>
                        <input id="lastName" type="text" placeholder="Doe" required />
                    </div>
                </div>

                <!-- Society input with browse button -->
                <div class="form-group">
                    <label for="society-input">Your Society</label>
                    <div class="society-row">
                        <div class="dropdown-wrapper" id="societyDropdown">
                            <input
                                id="society-input"
                                type="text"
                                placeholder="Type to search..."
                                autocomplete="off"
                                required
                            />
                            <ul class="dropdown-list" id="societyList">
                                <li class="no-results">Start typing to search...</li>
                            </ul>
                        </div>
                        <button type="button" class="browse-btn" id="browseAllBtn">Browse All</button>
                    </div>
                    <div class="dropdown-hint">
                        Type at least one character to filter, or click "Browse All" for a full list.
                    </div>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input id="signup-email" type="email" placeholder="studentnumber@students.wits.ac.za" required />
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input id="signup-password" type="password" placeholder="Use a strong password" required />
                </div>

                <div id="register-error" class="error-message"></div>

                <button type="submit" class="btn btn-primary" id="register-btn" disabled>Create account</button>
            </form>

            <hr class="divider">

            <div class="footer-link">
                Already have an account? <a href="/login.html">Sign in</a>
            </div>

            <div class="wits-badge">University of the Witwatersrand</div>
        </div>
    </div>

    <!-- Modal for full society list -->
    <div class="modal-overlay" id="societyModal">
        <div class="modal">
            <div class="modal-header">
                <h2>All Societies</h2>
                <button class="modal-close" id="modalCloseBtn">✕</button>
            </div>
            <div class="modal-search">
                <input type="text" id="modalSearchInput" placeholder="Filter societies..." />
            </div>
            <ul class="modal-list" id="modalSocietyList">
                <li class="no-results">Loading...</li>
            </ul>
            <div class="modal-footer">
                <button class="load-more-btn" id="loadMoreBtn">Load More</button>
                <span class="loading-text" id="modalLoadingText"></span>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsWp91SrNnlVHoyJWJyxjvXgGY6debDLE",
            authDomain: "wits-student-societies-backup.firebaseapp.com",
            projectId: "wits-student-societies-backup",
            storageBucket: "wits-student-societies-backup.firebasestorage.app",
            messagingSenderId: "111338778369",
            appId: "1:111338778369:web:5633595cd3fec3113c3500",
            measurementId: "G-D01M5HWGOV"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // DOM refs
        const societyInput = document.getElementById('society-input');
        const societyList = document.getElementById('societyList');
        const registerBtn = document.getElementById('register-btn');
        const errorEl = document.getElementById('register-error');
        const browseBtn = document.getElementById('browseAllBtn');

        // Modal refs
        const modal = document.getElementById('societyModal');
        const modalList = document.getElementById('modalSocietyList');
        const modalSearch = document.getElementById('modalSearchInput');
        const modalClose = document.getElementById('modalCloseBtn');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const modalLoadingText = document.getElementById('modalLoadingText');

        // State
        let allSocieties = [];
        let activeIndex = -1;
        let isDropdownOpen = false;

        // Pagination state for modal (10 per page)
        let modalLastDoc = null;
        let modalHasMore = true;
        let modalLoading = false;
        let modalAllSocieties = [];
        const MODAL_PAGE_SIZE = 10;

        // --- Load societies for autocomplete (initial) ---
        async function loadSocieties() {
            try {
                const snapshot = await db.collection('societies')
                    .orderBy('name', 'asc')
                    .get();

                if (snapshot.empty) {
                    societyList.innerHTML = '<li class="no-results">No societies available – contact SGO</li>';
                    registerBtn.disabled = true;
                    return;
                }

                allSocieties = [];
                snapshot.forEach(doc => {
                    const name = doc.data().name || 'Unnamed';
                    allSocieties.push(name);
                });

                societyList.innerHTML = '<li class="no-results">Start typing to search...</li>';
                registerBtn.disabled = false;

            } catch (error) {
                console.error('Error loading societies:', error);
                societyList.innerHTML = '<li class="no-results">Error loading societies – refresh</li>';
                registerBtn.disabled = true;
            }
        }

        function renderDropdown(items) {
            if (!items || items.length === 0) {
                societyList.innerHTML = '<li class="no-results">No matching societies found</li>';
                return;
            }
            const html = items.map(name => `<li data-value="${escapeHtml(name)}">${escapeHtml(name)}</li>`).join('');
            societyList.innerHTML = html;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // --- Filter for autocomplete dropdown (only if input has text) ---
        function filterAndShow(query) {
            const trimmed = query.trim();
            if (trimmed.length === 0) {
                closeDropdown();
                societyList.innerHTML = '<li class="no-results">Start typing to search...</li>';
                return;
            }
            const lower = trimmed.toLowerCase();
            const filtered = allSocieties.filter(name => name.toLowerCase().includes(lower));
            renderDropdown(filtered);
            activeIndex = -1;
            const items = societyList.querySelectorAll('li:not(.no-results)');
            if (items.length > 0) {
                items[0].classList.add('active');
                activeIndex = 0;
            }
            openDropdown();
        }

        // --- Open / close autocomplete dropdown ---
        function openDropdown() {
            societyList.classList.add('open');
            isDropdownOpen = true;
        }

        function closeDropdown() {
            societyList.classList.remove('open');
            isDropdownOpen = false;
            activeIndex = -1;
            document.querySelectorAll('#societyList li').forEach(li => li.classList.remove('active'));
        }

        // --- Select item (from either dropdown or modal) ---
        function selectSociety(value) {
            societyInput.value = value;
            closeDropdown();
            validateSociety();
            errorEl.style.display = 'none';
        }

        // --- Validate ---
        function validateSociety() {
            const val = societyInput.value.trim();
            if (val && allSocieties.includes(val)) {
                errorEl.style.display = 'none';
                return true;
            } else if (val) {
                errorEl.textContent = 'Please select a valid society from the list.';
                errorEl.style.display = 'block';
                return false;
            }
            return false;
        }

        // --- Autocomplete event listeners ---

        societyInput.addEventListener('input', function(e) {
            const val = this.value.trim();
            if (val.length === 0) {
                closeDropdown();
                societyList.innerHTML = '<li class="no-results">Start typing to search...</li>';
            } else {
                filterAndShow(val);
            }
            validateSociety();
        });

        societyInput.addEventListener('focus', function() {
            const val = this.value.trim();
            if (val.length > 0) {
                filterAndShow(val);
            } else {
                closeDropdown();
                societyList.innerHTML = '<li class="no-results">Start typing to search...</li>';
            }
        });

        societyInput.addEventListener('blur', function(e) {
            setTimeout(() => {
                closeDropdown();
                validateSociety();
            }, 150);
        });

        societyList.addEventListener('click', function(e) {
            const li = e.target.closest('li');
            if (!li || li.classList.contains('no-results')) return;
            const value = li.dataset.value;
            if (value) {
                selectSociety(value);
                societyInput.focus();
            }
        });

        societyInput.addEventListener('keydown', function(e) {
            const items = societyList.querySelectorAll('li:not(.no-results)');
            if (items.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!isDropdownOpen) {
                    const val = societyInput.value.trim();
                    if (val.length === 0) return;
                    filterAndShow(val);
                }
                activeIndex = (activeIndex + 1) % items.length;
                updateActiveItem(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (!isDropdownOpen) {
                    const val = societyInput.value.trim();
                    if (val.length === 0) return;
                    filterAndShow(val);
                }
                activeIndex = (activeIndex - 1 + items.length) % items.length;
                updateActiveItem(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (activeIndex >= 0 && activeIndex < items.length) {
                    const selected = items[activeIndex];
                    const value = selected.dataset.value;
                    if (value) selectSociety(value);
                } else if (items.length === 1) {
                    const value = items[0].dataset.value;
                    if (value) selectSociety(value);
                }
                closeDropdown();
                societyInput.blur();
            } else if (e.key === 'Escape') {
                closeDropdown();
                societyInput.blur();
            }
        });

        function updateActiveItem(items) {
            items.forEach((li, idx) => {
                li.classList.toggle('active', idx === activeIndex);
            });
            const activeLi = items[activeIndex];
            if (activeLi) {
                activeLi.scrollIntoView({ block: 'nearest' });
            }
        }

        // --- MODAL: Open, close, load data (10 per page) ---

        browseBtn.addEventListener('click', function() {
            modal.classList.add('active');
            modalLastDoc = null;
            modalHasMore = true;
            modalAllSocieties = [];
            modalList.innerHTML = '<li class="no-results">Loading societies...</li>';
            loadMoreBtn.classList.remove('hidden');
            loadMoreBtn.disabled = false;
            modalLoadingText.textContent = '';
            modalSearch.value = '';
            loadModalSocieties();
        });

        function closeModal() {
            modal.classList.remove('active');
        }
        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        loadMoreBtn.addEventListener('click', function() {
            if (!modalLoading && modalHasMore) {
                loadModalSocieties();
            }
        });

        modalSearch.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            if (query.length === 0) {
                renderModalList(modalAllSocieties);
            } else {
                const filtered = modalAllSocieties.filter(name => name.toLowerCase().includes(query));
                renderModalList(filtered);
            }
            if (query.length > 0) {
                loadMoreBtn.classList.add('hidden');
            } else {
                loadMoreBtn.classList.toggle('hidden', !modalHasMore);
            }
        });

        function renderModalList(items) {
            if (!items || items.length === 0) {
                modalList.innerHTML = '<li class="no-results">No societies found</li>';
                return;
            }
            const html = items.map(name => `<li data-value="${escapeHtml(name)}">${escapeHtml(name)}</li>`).join('');
            modalList.innerHTML = html;
            modalList.querySelectorAll('li:not(.no-results)').forEach(li => {
                li.addEventListener('click', function() {
                    const value = this.dataset.value;
                    if (value) {
                        selectSociety(value);
                        closeModal();
                    }
                });
            });
        }

        async function loadModalSocieties() {
            if (modalLoading) return;
            modalLoading = true;
            loadMoreBtn.disabled = true;
            modalLoadingText.textContent = 'Loading...';

            try {
                let query = db.collection('societies')
                    .orderBy('name', 'asc')
                    .limit(MODAL_PAGE_SIZE);

                if (modalLastDoc) {
                    query = query.startAfter(modalLastDoc);
                }

                const snapshot = await query.get();

                if (snapshot.empty) {
                    modalHasMore = false;
                    loadMoreBtn.classList.add('hidden');
                    modalLoadingText.textContent = 'All societies loaded';
                    return;
                }

                const newSocieties = [];
                snapshot.forEach(doc => {
                    const name = doc.data().name || 'Unnamed';
                    newSocieties.push(name);
                });

                modalLastDoc = snapshot.docs[snapshot.docs.length - 1];
                modalAllSocieties = modalAllSocieties.concat(newSocieties);

                const searchQuery = modalSearch.value.trim().toLowerCase();
                if (searchQuery.length > 0) {
                    const filtered = modalAllSocieties.filter(name => name.toLowerCase().includes(searchQuery));
                    renderModalList(filtered);
                } else {
                    renderModalList(modalAllSocieties);
                }

                if (snapshot.docs.length < MODAL_PAGE_SIZE) {
                    modalHasMore = false;
                    loadMoreBtn.classList.add('hidden');
                    modalLoadingText.textContent = 'All societies loaded';
                } else {
                    loadMoreBtn.classList.remove('hidden');
                    loadMoreBtn.disabled = false;
                    modalLoadingText.textContent = '';
                }

            } catch (error) {
                console.error('Error loading modal societies:', error);
                modalList.innerHTML = '<li class="no-results">Error loading societies. Please try again.</li>';
                loadMoreBtn.classList.add('hidden');
                modalLoadingText.textContent = 'Error';
            } finally {
                modalLoading = false;
            }
        }

        // --- Registration form submit ---
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const societyName = societyInput.value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;

            if (!allSocieties.includes(societyName)) {
                errorEl.textContent = 'Please select a valid society from the list.';
                errorEl.style.display = 'block';
                societyInput.focus();
                return;
            }

            errorEl.style.display = 'none';
            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating account...';

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                const otpCode = Math.floor(100000 + Math.random() * 900000).toString();
                const expiresAt = new Date();
                expiresAt.setMinutes(expiresAt.getMinutes() + 15);

                await db.collection('emailVerifications').doc(user.uid).set({
                    userId: user.uid,
                    email: email,
                    code: otpCode,
                    expiresAt: expiresAt,
                    createdAt: new Date(),
                    verified: false
                });

                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    email: email,
                    firstName: firstName,
                    lastName: lastName,
                    societyName: societyName,
                    role: 'leader',
                    isEmailVerified: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                localStorage.setItem('pendingUserId', user.uid);
                localStorage.setItem('pendingUserEmail', email);
                localStorage.setItem('pendingUserName', firstName + ' ' + lastName);

                console.log('=========================================');
                console.log('VERIFICATION CODE FOR:', email);
                console.log('CODE:', otpCode);
                console.log('Expires at:', expiresAt.toLocaleTimeString());
                console.log('=========================================');

                try {
                    await fetch('/api/send-verification-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            code: otpCode,
                            name: firstName + ' ' + lastName
                        }),
                    });
                } catch (emailError) {
                    console.error('Email sending error:', emailError);
                }

                await auth.signOut();

                registerBtn.textContent = '✅ Check your email!';
                registerBtn.style.background = '#28a745';

                setTimeout(() => {
                    window.location.href = '/verify-otp.html';
                }, 1500);

            } catch (err) {
                console.error('Registration error:', err);
                const friendlyMessage = getFriendlyErrorMessage(err.code);
                errorEl.textContent = friendlyMessage;
                errorEl.style.display = 'block';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create account';
            }
        });

        function getFriendlyErrorMessage(errorCode) {
            const messages = {
                'auth/email-already-in-use': 'This email is already registered. Please sign in instead.',
                'auth/invalid-email': 'The email address is not valid. Please check and try again.',
                'auth/weak-password': 'Password is too weak. Please use at least 6 characters.',
                'auth/network-request-failed': 'Network error. Please check your internet connection.',
                'auth/internal-error': 'Something went wrong. Please try again.'
            };
            return messages[errorCode] || 'Unable to create account. Please try again.';
        }

        document.addEventListener('DOMContentLoaded', loadSocieties);
    </script>
</body>
</html>
