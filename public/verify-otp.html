<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email - Wits Student Societies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-900: #0B1F3A;
            --navy-800: #13315C;
            --navy-700: #1B3E73;
            --blue-600: #2E6FBA;
            --blue-500: #3E7CB1;
            --bg: #0B1F3A;
            --surface: #FFFFFF;
            --text-900: #0B1F3A;
            --text-600: #3D4A63;
            --text-500: #5A6B87;
            --border: #E1E7F0;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container { max-width: 440px; width: 100%; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 36px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            text-align: center;
        }
        .logo {
            width: 48px; height: 48px; border-radius: 12px;
            background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
            display: flex; align-items: center; justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700; font-size: 18px; color: #fff;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px rgba(46, 111, 186, 0.3);
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px; font-weight: 600;
            color: var(--navy-900); margin-bottom: 4px;
        }
        .subtitle {
            font-size: 14px; color: var(--text-500); margin-bottom: 24px;
        }
        .subtitle strong { color: var(--text-900); }
        .otp-input {
            width: 100%; padding: 16px; font-size: 28px;
            letter-spacing: 12px; text-align: center;
            border: 1px solid var(--border); border-radius: 8px;
            font-family: 'Inter', sans-serif; font-weight: 600;
            color: var(--text-900); background: var(--surface);
            transition: border-color 0.2s; margin-bottom: 16px;
        }
        .otp-input:focus {
            outline: none; border-color: var(--navy-900);
            box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.08);
        }
        .btn {
            width: 100%; font-family: 'Inter', sans-serif;
            font-size: 14px; font-weight: 600; padding: 12px;
            border-radius: 8px; border: none; cursor: pointer;
            transition: all 0.2s ease; letter-spacing: 0.01em;
        }
        .btn-primary { background: var(--navy-900); color: #fff; }
        .btn-primary:hover {
            background: var(--navy-800); transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(11, 31, 58, 0.2);
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .resend-link {
            display: inline-block; margin-top: 14px;
            color: var(--blue-600); text-decoration: none;
            font-size: 13px; font-weight: 600;
        }
        .resend-link:hover { text-decoration: underline; }
        .back-link {
            display: inline-block; margin-top: 10px;
            color: var(--text-500); text-decoration: none; font-size: 13px;
        }
        .back-link:hover { color: var(--navy-900); text-decoration: underline; }
        .message {
            margin-top: 14px; padding: 10px 14px;
            border-radius: 6px; font-size: 14px; display: none;
        }
        .message.success {
            display: block; background: #d4edda; color: #155724;
            border-left: 4px solid #28a745;
        }
        .message.error {
            display: block; background: #f8d7da; color: #721c24;
            border-left: 4px solid #dc3545;
        }
        .message.info {
            display: block; background: #e9f2ff; color: #1a3f7a;
            border-left: 4px solid #2b5fa8;
        }
        .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        .wits-badge {
            text-align: center; margin-top: 20px;
            font-size: 11px; color: var(--text-500);
            letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">SGO</div>
            <h1>Verify Your Email</h1>
            <p class="subtitle">We sent a 6-digit code to <strong id="userEmail"></strong></p>

            <input type="text" id="otpCode" class="otp-input" maxlength="6" placeholder="• • • • • •">

            <button class="btn btn-primary" id="verifyBtn">Verify Account</button>

            <a href="#" id="resendLink" class="resend-link">Didn't receive code? Resend</a>
            <br>
            <a href="/login.html" class="back-link">← Back to Sign In</a>

            <div id="message" class="message"></div>

            <hr class="divider">

            <div class="wits-badge">University of the Witwatersrand</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsWp91SrNnlVHoyJWJyxjvXgGY6debDLE",
            authDomain: "wits-student-societies-backup.firebaseapp.com",
            projectId: "wits-student-societies-backup",
            storageBucket: "wits-student-societies-backup.firebasestorage.app",
            messagingSenderId: "111338778369",
            appId: "1:111338778369:web:5633595cd3fec3113c3500",
            measurementId: "G-D01M5HWGOV"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
                const otpInput = document.getElementById('otpCode');
        const verifyBtn = document.getElementById('verifyBtn');
        const resendLink = document.getElementById('resendLink');
        const messageDiv = document.getElementById('message');
        const userEmailSpan = document.getElementById('userEmail');

        function showMessage(text, type) {
            messageDiv.className = 'message ' + type;
            messageDiv.textContent = text;
        }

        // Sends a request to our server with the user's login token attached
        async function callApi(path, body) {
            const user = auth.currentUser;
            if (!user) throw new Error('Please sign in again.');
            const token = await user.getIdToken();
            const res = await fetch(path, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(body || {})
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Request failed');
            return data;
        }

        async function sendCode() {
            showMessage('Sending code...', 'info');
            try {
                await callApi('/api/send-otp');
                showMessage('A new code has been sent. Check your email.', 'success');
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        // Wait for Firebase to tell us who is signed in
        auth.onAuthStateChanged((user) => {
            if (!user) {
                userEmailSpan.textContent = 'your email';
                verifyBtn.disabled = true;
                resendLink.style.opacity = '0.5';
                showMessage('Please sign in first. We will bring you back here to verify.', 'error');
                return;
            }

            if (user.emailVerified) {
                window.location.href = '/login.html';
                return;
            }

            userEmailSpan.textContent = user.email;
            verifyBtn.disabled = false;
            resendLink.style.opacity = '1';

            // Coming from the login page: no code has been sent yet, so send one
            if (new URLSearchParams(window.location.search).get('resend') === '1') {
                history.replaceState(null, '', '/verify-otp.html');
                sendCode();
            }
        });

        verifyBtn.addEventListener('click', async () => {
            const code = otpInput.value.trim();

            if (!/^\d{6}$/.test(code)) {
                showMessage('Please enter the 6-digit verification code.', 'error');
                return;
            }

            showMessage('Verifying...', 'info');
            verifyBtn.disabled = true;

            try {
                await callApi('/api/verify-otp', { code });

                // Sign out so the user logs back in with a fresh, verified account
                try { await auth.signOut(); } catch (e) { console.warn('Sign out failed:', e); }

                showMessage('✅ Email verified successfully! Redirecting to login...', 'success');
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);

            } catch (error) {
                console.error('Verification error:', error);
                showMessage(error.message, 'error');
                verifyBtn.disabled = false;
            }
        });

        resendLink.addEventListener('click', (e) => {
            e.preventDefault();
            sendCode();
        });
    </script>
</body>
</html>
